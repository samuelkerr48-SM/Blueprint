<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VC Curriculum Audit has moved</title>
<meta http-equiv="refresh" content="0; url=https://samuelkerr48-sm.github.io/vc-audit/">
<link rel="canonical" href="https://samuelkerr48-sm.github.io/vc-audit/">
<style>body{font:16px/1.5 "Segoe UI",Arial,sans-serif;color:#1F1646;max-width:560px;margin:15vh auto;padding:0 20px}a{color:#D40032;font-weight:700}</style>
</head><body>
<h1>VC Curriculum Audit has moved</h1>
<p>It now has its own address, so it can be installed as its own app:</p>
<p><a href="https://samuelkerr48-sm.github.io/vc-audit/">samuelkerr48-sm.github.io/vc-audit</a></p>
<p>Audits saved in this browser carry over.</p>
<script>
// retire the old copy's offline worker, then go to the new address
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/curriculum-audit\/$/.test(r.scope))r.unregister();}));}
if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.startsWith('ca-audit-')).forEach(k=>caches.delete(k)));
location.replace('https://samuelkerr48-sm.github.io/vc-audit/'+location.hash);
</script>
</body></html>
