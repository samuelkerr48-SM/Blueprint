:root{--band:linear-gradient(90deg,var(--navy) 0 25%,var(--blue) 25% 70%,var(--b300) 70%);--font:Arial,Helvetica,sans-serif;--navy:#012C5F;--blue:#2A6DB8;--b50:#EEF5FC;--b100:#DCEAF8;--b200:#B5D3F1;--b300:#55A0E0;--ink:#14202e;--muted:#5a6878;--line:#d5dfea;--bg:#f5f8fb;
--el-plan:#55A0E0;--el-enab:#2A6DB8;--el-expl:#012C5F;--el-supp:#1D4F8F}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
a{color:var(--blue)}
header.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
header.top .brand .mark{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}header.top .brand .mark img{width:32px;height:32px}
header.top nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
header.top nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:6px}
header.top nav button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
.band{height:6px;background:var(--band)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;margin:0 0 6px;color:var(--navy)}
h2{font-size:20px;margin:0 0 10px;color:var(--navy)}
h3{font-size:16px;margin:0 0 6px;color:var(--navy)}
p.lead{color:var(--muted);margin:0 0 18px;max-width:840px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:10px 16px;font-weight:700}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.hi{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--blue);border:0;text-decoration:underline;padding:6px 4px;font-weight:400}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--b50);color:var(--navy);border:1px solid var(--b200)}
.pill.plan{background:#f1f7fd;color:#2d5f93;border-color:var(--b200)}
.pill.enab{background:var(--b50);color:var(--blue);border-color:var(--b200)}
.pill.expl{background:#e7edf4;color:var(--navy);border-color:#c3d0de}
.pill.supp{background:#e6eef7;color:var(--el-supp);border-color:#bcd0e6}
.pill.own{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill.edited{background:#fff;color:var(--blue);border:1.5px dashed var(--blue)}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:0 0 4px}
input.t,textarea.t,select.t{width:100%;padding:9px 10px;border:1px solid #bccbdb;border-radius:7px;background:#fff}
textarea.t{min-height:70px;resize:vertical}
.stepper{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.stepper .s{flex:1;min-width:130px;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer}
.stepper .s b{display:block;color:var(--navy);font-size:14px}
.stepper .s.on{border-color:var(--navy);box-shadow:inset 0 -4px 0 var(--blue)}
.stepper .s.done b::after{content:" ✓";color:var(--blue)}
.tip{background:var(--b50);border-left:5px solid var(--blue);padding:12px 14px;border-radius:6px;margin:0 0 16px;font-size:14px}
.tip b{color:var(--navy)}
.warn{background:#fff;border:2px solid var(--blue);border-radius:10px;padding:12px 14px;margin:0 0 16px}
.el-head{display:flex;align-items:center;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.el-head .bar{width:6px;height:26px;border-radius:3px}
.vref{font-size:12px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.macro{background:#fff;border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;width:100%;position:relative}
.macro:hover{border-color:var(--b300)}
.macro.sel{border-color:var(--navy);background:#fbfdff;box-shadow:0 0 0 3px rgba(46,125,209,.15)}
.macro.sel::after{content:"✓";position:absolute;top:10px;right:12px;background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.macro h3{padding-right:26px}
.macro .plays{font-size:12.5px;color:var(--muted);margin-top:8px}
.probgroup{margin-bottom:18px}
.prob{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.prob.sel{border-color:var(--blue);background:var(--b50)}
.prob .box{width:20px;height:20px;border:2px solid #8fa3b8;border-radius:4px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.prob.sel .box{background:var(--blue);border-color:var(--blue)}
.prob .ask{font-size:13px;color:var(--muted);margin-top:3px}
.prob .ask i{color:var(--blue);font-style:normal;font-weight:700}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--navy)}
.tcard.plan{border-top-color:var(--el-plan)}.tcard.enab{border-top-color:var(--el-enab)}.tcard.expl{border-top-color:var(--el-expl)}.tcard.supp{border-top-color:var(--el-supp)}
.tcard .why{font-size:13px;color:var(--muted)}
.tcard .fit{font-size:12.5px;background:var(--bg);border-radius:6px;padding:7px 9px}
.tcard.chosen{outline:3px solid var(--blue)}
.rank1{position:relative}
.rank1::before{content:"Best bet";position:absolute;top:-11px;right:12px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px}
.thead{background:var(--navy);color:#fff;border-radius:12px;padding:20px 22px;position:relative;overflow:hidden}
.thead::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:var(--blue);opacity:.55}
.thead::before{content:"";position:absolute;right:110px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:var(--b300);opacity:.45}
.thead h1{color:#fff;font-size:28px;position:relative;z-index:1}
.thead p{margin:6px 0 0;max-width:720px;position:relative;z-index:1;color:#e6eef7}
.thead .crumbs{font-size:12.5px;color:var(--b200);margin-bottom:6px;position:relative;z-index:1}
.thead .pill{position:relative;z-index:1}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:48px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-items:start}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.step h3{margin:2px 0 3px}
.step p{margin:0;color:#2a3949}
ul.tick{margin:0;padding-left:0;list-style:none}
ul.tick li{padding:4px 0 4px 24px;position:relative}
ul.tick li::before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:700}
ul.cross li::before{content:"!";color:var(--navy)}
.say{background:var(--b50);border:1px dashed var(--b300);border-radius:8px;padding:10px 12px;font-size:14px}
.vidbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.vidframe{position:relative;padding-top:56.25%;background:#0b1520;border-radius:8px;overflow:hidden;margin-top:10px}
.vidframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;z-index:99;display:none;max-width:92vw;border-left:6px solid var(--blue)}
.toast a{color:var(--b200)}
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input.t{flex:1;min-width:220px}
.tablet{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.tablet{grid-template-columns:1fr}.stepper .s{min-width:100px}}
.plan-c{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:16px;margin-bottom:14px}
.histteacher{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.histitem{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(8,25,45,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal .inner{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:20px;border-top:6px solid var(--blue)}
.path{background:var(--b50);color:var(--navy);border-radius:6px;padding:8px 10px;margin:10px 0;word-break:break-word;font-size:14px}
.path span{margin:0 5px;color:var(--blue)}
.edstep{display:grid;grid-template-columns:30px 1fr 2fr 30px;gap:8px;align-items:start;margin-bottom:8px}
.edstep .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:4px}
@media(max-width:700px){.edstep{grid-template-columns:30px 1fr 30px}.edstep textarea{grid-column:2/3}}
.plist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.plist label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 0}
.plist .mh{font-weight:700;color:var(--navy);margin:8px 0 2px;font-size:13px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;margin:2px 10px 2px 0}
.kpi{font-size:26px;font-weight:700;color:var(--blue)}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;font-size:11pt}
  header.top,.band,main,.toast,.modal{display:none!important}
  #printArea{display:block!important}
}
.ps{font-family:var(--font);color:#14202e}
.ps .page{page-break-after:always;break-after:page}
.ps .page:last-child{page-break-after:auto;break-after:auto}
.ps .hd{background:var(--navy);color:#fff;padding:10px 14px;border-radius:6px;display:flex;justify-content:space-between;align-items:flex-end;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps .hd h1{color:#fff;font-size:20pt;margin:0}
.ps .hd .sub{font-size:9pt;color:var(--b200)}
.ps .strip{height:5px;background:var(--band);margin:4px 0 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps h2{font-size:12.5pt;color:var(--navy);margin:10px 0 5px;border-bottom:1.5px solid var(--blue);padding-bottom:2px}
.ps p{margin:3px 0}
.ps table{width:100%;border-collapse:collapse;font-size:10pt}
.ps td,.ps th{border:1px solid #b3c2d2;padding:5px 7px;vertical-align:top;text-align:left}
.ps th{background:var(--b50);color:var(--navy);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps .num{width:26px;text-align:center;font-weight:700;color:var(--blue)}
.ps .rate{white-space:nowrap;text-align:center;width:120px;font-size:9pt}
.ps .lines{border:1px solid #b3c2d2;border-radius:4px;padding:5px 8px;margin-bottom:6px}
.ps .lines .q{font-weight:700;color:var(--navy);font-size:10pt}
.ps .lines .l{border-bottom:1px solid #d3dce6;height:20px}
.ps .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ps ul{margin:2px 0;padding-left:16px;font-size:10pt}
.ps .meta{font-size:9.5pt;color:#444}
.ps .box{border:1px solid #b3c2d2;border-radius:4px;padding:6px 8px;font-size:10pt;min-height:28px}
.ps .foot{font-size:8pt;color:#777;margin-top:8px}

/* v3 additions */
.hero{display:flex;gap:20px;align-items:center;margin-bottom:8px}.hero img{width:96px;height:96px;flex:none}
@media(max-width:600px){.hero img{width:64px;height:64px}}
.pill.pb{background:#fff8e1;color:#7a5600;border-color:#f0d58a}
.pill.sug{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tbtn{position:relative;background:#fff;border:2px solid var(--b200);border-radius:12px;padding:12px 12px 10px;cursor:pointer;user-select:none;min-height:104px}

.tbtn .tn{font-weight:700;color:var(--navy)}.tbtn .td{font-size:12px;color:var(--muted);padding-right:30px;padding-bottom:26px}

.tbtn .tminus{position:absolute;left:10px;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:12px;padding:2px 6px;color:var(--muted)}
.obsclock{text-align:center}.clock{font-size:46px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin:4px 0 8px}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rchip{border:1.5px solid var(--b200);background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;color:var(--navy)}
.rchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{border-left:4px solid var(--b200);padding:6px 8px;margin-bottom:6px;background:var(--bg);border-radius:4px;font-size:14px;position:relative}
.note.strength{border-left-color:var(--blue)}.note.question{border-left-color:var(--navy)}
.note .nt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

.kbox{background:var(--bg);border-radius:8px;padding:10px}.kbox .kpi{font-size:22px}
.dtimer{position:sticky;top:64px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(1,44,95,.06)}
.dtimer .t{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:70px}

.dtimer .ph.on{background:var(--blue);color:#fff;font-weight:700}.dtimer .ph.done{background:var(--b200)}
.dtimer.over .t{color:#b00020}
.rate4{display:flex;gap:4px;flex-wrap:wrap}.rate4 button{border:1.5px solid var(--b200);background:#fff;border-radius:6px;padding:4px 8px;font-size:12.5px;color:var(--navy)}
.rate4 button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lv{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--b200)}
.lv.notyet{background:#fff;color:var(--navy)}.lv.partly{background:var(--b100);color:var(--navy)}.lv.secure{background:var(--blue);color:#fff;border-color:var(--blue)}
.timeline{border-left:3px solid var(--b200);margin:8px 0 0 6px;padding-left:14px}
.tl{position:relative;padding:6px 0 10px}.tl::before{content:"";position:absolute;left:-21px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.bars .bar{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,1fr) 30px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:5px}
.bars .track{display:block;background:var(--b50);border-radius:4px;height:14px;overflow:hidden}.bars .fill{background:var(--blue);height:100%}
.links a{display:block;padding:3px 0}
.guide-links{font-size:12.5px;margin-top:6px}
/* cards (print) */
.ps .cardpage{display:grid;grid-template-rows:1fr 1fr;gap:8mm;height:258mm}
.ps .tcardp{border:2px solid var(--navy);border-radius:10px;padding:8px 12px;overflow:hidden;position:relative}
.ps .tcardp h3{margin:0;font-size:17pt;color:var(--navy)}
.ps .tcardp .cm{font-size:8.5pt;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.3px}

.ps .hd img{width:40px;height:40px;background:#fff;border-radius:50%;padding:3px;margin-right:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.ps .cover{text-align:center;padding-top:40mm}.ps .cover img{width:60mm;height:60mm}.ps .cover h1{font-size:28pt;color:var(--navy);margin:10mm 0 4mm}

.ps .rate4p span{display:inline-block;border:1px solid #b3c2d2;border-radius:4px;padding:1px 6px;margin-right:3px;font-size:9pt}

.goalbar{background:var(--navy);color:#fff;border-radius:8px;padding:8px 12px;margin:0 0 14px}.goalbar .muted{color:var(--b200)!important}
.notice{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:10px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px;margin-bottom:10px;align-items:start}

.bmac{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bprob{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:14px}

.mlist{margin:4px 0 0;padding-left:16px}

const ELEMENTS=[{"id":"plan","n":"Planning","d":"Develop and deliver quality curriculum materials: plan how to deliver the curriculum and prepare to teach."},{"id":"enab","n":"Enabling learning","d":"Inclusive learning, Positive Classroom Management Strategies (PCMS), self-regulation and self-efficacy, cultural responsiveness."},{"id":"expl","n":"Explicit teaching","d":"Focus the learning, explicit explanation and modelling, scaffold practice, monitor progress."},{"id":"supp","n":"Supported application","d":"Vary practice, revisit and review, apply learning and build mastery."}];
const MACROS=[{"id":"prep","el":"plan","n":"Prepare to teach","v":"Develop and deliver quality curriculum materials › Practice 2: Plan how to deliver the curriculum (Determine class and student needs; Prepare to teach)","d":"Internalise the lesson, anticipate misconceptions, plan checks and adjustments before teaching.","probs":[{"id":"pl1","t":"Teacher reading or learning the lesson materials while teaching","ask":"How did you prepare this lesson? Which part felt least sure as you were teaching it?","techs":["prepTeach","exemplar"]},{"id":"pl2","t":"Predictable misconceptions caught the teacher by surprise","ask":"Which error surprised you? Could we have predicted it from the content?","techs":["anticipateMis","exNonEx","hinge"]},{"id":"pl3","t":"No clear picture of what a correct answer looks like","ask":"What would a perfect answer to your key question have included?","techs":["exemplar","prepTeach"]},{"id":"pl4","t":"Adjustments for students were improvised or missing","ask":"Which students needed something different today? Was it planned?","techs":["planAdjust","taskAdjust","anticipateMis"]}]},{"id":"inclusive","el":"enab","n":"Inclusive learning & relationships","v":"Inclusive learning › Practice 1: Support students to reach their potential; Practice 2: Build inclusion through strong relationships","d":"High expectations for all, full participation, trusting relationships and positive peer interactions.","probs":[{"id":"in1","t":"Lower expectations or easier questions for some students","ask":"Who got the hardest questions today? Who did you rescue quickly?","techs":["highExpect","coldCall","noOptOut"]},{"id":"in2","t":"Some students not able to participate fully","ask":"Which students couldn’t access the main task? What would have let them?","techs":["planAdjust","taskAdjust","cpa"]},{"id":"in3","t":"Relationships feel transactional; students unsettled on arrival","ask":"How did students arrive today? What did you know about how they were going?","techs":["threshold","studentVoice","praise"]},{"id":"in4","t":"Peer interactions negative, exclusive or unproductive","ask":"How did students treat each other when working together? Who was left out?","techs":["partnerships","respectNorms","groupWork"]},{"id":"in5","t":"Students afraid to make mistakes or be wrong","ask":"How did students react when an answer was wrong? Did anyone hide their work?","techs":["normaliseError","highExpect","mwb"]}]},{"id":"routines","el":"enab","n":"Rules, procedures & routines","v":"PCMS 1: Classroom rules and expectations; PCMS 2: Classroom procedures and routines","d":"Taught, practised and consistently applied expectations and routines that protect learning time.","probs":[{"id":"r1","t":"Slow start – students not working in the first few minutes","ask":"What were students doing in the first three minutes? What did they need to know to start without you?","techs":["doNow","threshold","directions"]},{"id":"r2","t":"Instructions given, but many students unsure what to do","ask":"If I asked five students what they were meant to be doing, what would they say?","techs":["directions","attention","means"]},{"id":"r3","t":"Transitions take a long time and momentum is lost","ask":"Which transition took longest? Has that routine been explicitly taught and practised?","techs":["transitions","directions","precorrect"]},{"id":"r4","t":"Teacher talks while some students aren’t attending","ask":"When you began explaining, how did you know every student was with you?","techs":["attention","directions","positiveFraming"]},{"id":"r5","t":"Expectations unclear or applied inconsistently","ask":"Could students tell me what the expectation for this part of the lesson looks and sounds like?","techs":["teachExpect","precorrect","transitions"]}]},{"id":"behaviour","el":"enab","n":"Encouraging expected behaviour","v":"PCMS 3: Encouraging expected classroom behaviour; PCMS 4: Discouraging inappropriate behaviour","d":"Precorrect, acknowledge expected behaviour specifically, and respond to errors with the least disruption.","probs":[{"id":"b1","t":"Corrections interrupt the lesson or escalate","ask":"When you corrected that student, what happened to the rest of the class’s attention?","techs":["leastInvasive","positiveFraming","reteachBehav"]},{"id":"b2","t":"Praise is generic (“good job”, “great”)","ask":"What exactly did that student do well? Did they know which part to repeat?","techs":["praise","positiveFraming"]},{"id":"b3","t":"The same few students are repeatedly redirected","ask":"What do those students need to succeed earlier in the routine? When are they getting it right?","techs":["precorrect","praise","reteachBehav"]},{"id":"b4","t":"Minor behaviour responded to with consequences first","ask":"What did you try before the consequence? What’s the smallest response that might have worked?","techs":["leastInvasive","proximity","reteachBehav"]}]},{"id":"supervision","el":"enab","n":"Active supervision","v":"PCMS 5: Active supervision (position, move, scan, interact)","d":"Position to see everyone; move frequently and unpredictably; scan often; interact often.","probs":[{"id":"s1","t":"Teacher anchored at the front, desk or one group","ask":"Where did you spend most of the lesson? Which part of the room did you visit least?","techs":["circulate","activeMon","precorrect"]},{"id":"s2","t":"Off-task behaviour noticed late, after it has spread","ask":"When did you first notice the table near the window drifting? What was the earliest sign?","techs":["circulate","proximity","precorrect"]},{"id":"s3","t":"Back to the class while helping individuals","ask":"When you were helping one student, what could you see of the rest of the room?","techs":["positioning","circulate","activeMon"]},{"id":"s5","t":"Small-group or conference work leaves the rest of the class unsupervised","ask":"While you were with the group, what was the rest of the class doing? How did you know?","techs":["positioning","independent","proximity"]},{"id":"s4","t":"Most teacher–student interactions are corrective","ask":"Roughly, how many of your comments to students were positive versus corrective?","techs":["praise","circulate","positiveFraming"]}]},{"id":"otr","el":"enab","n":"Opportunities to respond","v":"PCMS 6: Opportunities to respond (verbal, written and non-verbal; individual, group and whole class)","d":"Frequent planned chances for every student to respond – not just volunteers.","probs":[{"id":"o1","t":"The same few students answer most questions","ask":"Who answered today? Who didn’t say anything at all? What did you learn about their thinking?","techs":["coldCall","mwb","turnTalk"]},{"id":"o2","t":"Long stretches of teacher talk with no student response","ask":"How long did students go without having to respond? What could they have done every few minutes?","techs":["choral","mwb","turnTalk","everybodyWrites"]},{"id":"o3","t":"Students opt out (“I don’t know”, shrug, silence)","ask":"When a student said “I don’t know”, what happened next? Did they end up answering?","techs":["noOptOut","waitTime","turnTalk"]},{"id":"o4","t":"Hands up / calling out dominates","ask":"How did students know how they were expected to respond to each question?","techs":["means","coldCall","choral"]},{"id":"o5","t":"Partner talk is off-task or one-sided","ask":"What did you hear when you listened in to pairs? Did both partners speak?","techs":["turnTalk","partnerships","stems"]},{"id":"o6","t":"Answers taken immediately – little thinking time","ask":"How long after asking did you take the first answer? Who had time to think?","techs":["waitTime","everybodyWrites","turnTalk"]},{"id":"o7","t":"Response method doesn’t suit the question or the students","ask":"Which response method gave you the clearest evidence? Could every student respond that way?","techs":["signals","mwb","means"]}]},{"id":"sequence","el":"enab","n":"Activity sequence, choice & task difficulty","v":"PCMS 7: Activity sequence and choice; PCMS 8: Task difficulty","d":"Sequence tasks strategically, offer structured choice and pitch tasks so students succeed with effort.","probs":[{"id":"q1","t":"Lesson opens with the hardest task – students disengage early","ask":"How did the first task go? What did students experience in the first five minutes?","techs":["behMomentum","doNow"]},{"id":"q2","t":"Task too hard for some – avoidance or off-task behaviour","ask":"Which students avoided the task? What made it hard for them to start?","techs":["taskAdjust","behMomentum","guided"]},{"id":"q3","t":"Task too easy for some – finished early and drifted","ask":"What did your fastest students do when they finished?","techs":["extendPrompts","taskAdjust","openTask"]},{"id":"q4","t":"Low engagement in long or repetitive tasks","ask":"When did engagement drop? What could students have chosen or changed?","techs":["choiceMenu","behMomentum","taskAdjust"]}]},{"id":"selfreg","el":"enab","n":"Self-regulation & self-efficacy","v":"Enable student self-regulation and self-efficacy › Practice 1: Manage emotions, behaviour and motivation; Practice 2: Take control of their learning","d":"Teach regulation strategies, build motivation and self-efficacy, and teach metacognitive strategies.","probs":[{"id":"sr1","t":"Students give up quickly when work gets hard","ask":"What did students do when they got stuck? What did they say to themselves?","techs":["highExpect","selfQuestion","behMomentum"]},{"id":"sr2","t":"Dysregulated students take a long time to return to learning","ask":"What happened when that student became upset? What strategy did they have?","techs":["regulation","precorrect","leastInvasive"]},{"id":"sr3","t":"Students rely on the teacher to know what to do next","ask":"How many ‘what do I do?’ questions did you get? What could students have asked themselves?","techs":["selfQuestion","checklist","independent"]},{"id":"sr4","t":"Students can’t judge how they’re going against the goal","ask":"Could students tell you which success criteria they’d met?","techs":["trackSC","closeLoop","pme"]},{"id":"sr5","t":"Longer tasks without planning or monitoring","ask":"How did students approach the bigger task? Did anyone plan or check part-way?","techs":["pme","metaQ","checklist"]}]},{"id":"culture","el":"enab","n":"Cultural responsiveness","v":"Cultural responsiveness › Practice 1: Support cultural safety; Practice 2: Strengthen belonging and connectedness","d":"Cultural safety, respectful language, and learning programs that reflect students’ cultures.","probs":[{"id":"cu1","t":"Examples and texts don’t reflect students’ cultures or experiences","ask":"Whose names, stories and contexts were in today’s lesson? Who might not have seen themselves?","techs":["cultureConnect","hook"]},{"id":"cu2","t":"Disrespectful or discriminatory comments not addressed","ask":"What happened after that comment? How might the student it was about have felt?","techs":["respectNorms","positiveFraming"]},{"id":"cu3","t":"Some students don’t feel they belong in the class","ask":"Which students seem least connected? What do you know about their cultures and interests?","techs":["cultureConnect","threshold","studentVoice"]}]},{"id":"focus","el":"expl","n":"Focus the learning","v":"Focus the learning › Practice 1: State and explain learning objectives and success criteria; Practice 2: Activate prior knowledge and stimulate connections (incl. advance organisers)","d":"Clear objectives and success criteria, reviewed at the end; activate prior knowledge and connect to new learning.","probs":[{"id":"f1","t":"Prior learning not reviewed or activated before new content","ask":"What did students need to already know for today? How did you check they had it?","techs":["doNow","dailyReview","advanceOrg"]},{"id":"f2","t":"Students can’t say what they are learning or what success looks like","ask":"If I asked a student ‘what are you learning and how will you know you’ve got it?’, what would they say?","techs":["lisc","exemplar","trackSC"]},{"id":"f3","t":"No link made between prior learning and today’s objective","ask":"How did today connect to last week? Did students see the link?","techs":["advanceOrg","hook","dailyReview"]},{"id":"f4","t":"Lesson ends without checking the objective was met","ask":"How did the lesson end? What do you know about who met the success criteria?","techs":["closeLoop","exitTicket"]},{"id":"f5","t":"Key vocabulary not taught before it’s needed","ask":"Which words did students stumble on? Were they taught first?","techs":["vocab","choral","exNonEx"]}]},{"id":"explain","el":"expl","n":"Explicit explanation & modelling","v":"Explicit explanation and modelling › Practice 1: Explain the material in concise, small steps; Practice 2: Demonstrate and model (think aloud, worked examples, examples and non-examples)","d":"Concise, interactive explanations in small steps; demonstrations, think-alouds, worked examples, examples and non-examples.","probs":[{"id":"e1","t":"Explanation long or overloaded – students lose the thread","ask":"How many new ideas were in that explanation? Where could you have paused and checked?","techs":["chunking","dualCoding","prepTeach"]},{"id":"e2","t":"Explanation not interactive – few checks or responses","ask":"During the explanation, how often did every student respond?","techs":["mwb","choral","coldCall","signals"]},{"id":"e3","t":"Model skips steps or expert thinking stays invisible","ask":"Could a student reproduce your model from what they saw and heard? What decisions did you make silently?","techs":["thinkAloud","workedEx","selfQuestion"]},{"id":"e4","t":"Students confuse or over-generalise the concept","ask":"What did students think the concept included that it doesn’t? Did they see any non-examples?","techs":["exNonEx","hinge","anticipateMis"]},{"id":"e5","t":"Slides busy, digressions or complex language distract","ask":"Where were students looking while you were talking? What on the slide wasn’t needed?","techs":["dualCoding","chunking","vocab"]},{"id":"e6","t":"Same worked example style used regardless of progress","ask":"How did the examples change as students got better? Could some have done with fewer steps?","techs":["workedEx","fade","extendPrompts"]}]},{"id":"scaffold","el":"expl","n":"Scaffold practice","v":"Scaffold practice › Practice 1: Identify, provide and fade supports; Practices 2–3: Use scaffolds to model and explain, and to guide, monitor and extend practice","d":"Anticipate, provide and fade scaffolds: worked examples, stems, organisers, checklists, concrete materials, guided practice.","probs":[{"id":"p1","t":"Jump from model straight to independent work – low success","ask":"What happened between your model and students working alone? How many got the first one right?","techs":["guided","iWeYou","workedEx"]},{"id":"p2","t":"Scaffolds never removed – students rely on them","ask":"Which supports could most students now do without? How would you know?","techs":["fade","iWeYou","checklist"]},{"id":"p3","t":"Students stuck, waiting for help (a queue forms)","ask":"What could a stuck student do on their own before needing you?","techs":["independent","checklist","selfQuestion"]},{"id":"p4","t":"Talk or writing lacks structure and precise language","ask":"What did students’ answers sound like? What structure could have helped?","techs":["stems","graphicOrg","formatMatters"]},{"id":"p5","t":"Abstract content with no concrete or visual support","ask":"What could students see or hold to understand this idea?","techs":["cpa","dualCoding","graphicOrg"]},{"id":"p6","t":"Scaffolds added late, after students were already lost","ask":"When did you realise students needed more support? What could have been ready?","techs":["anticipateMis","planAdjust","smallGroup"]}]},{"id":"cfu","el":"expl","n":"Check for understanding & feedback","v":"Monitor progress › Practice 1: Use formative assessment and feedback (check for understanding and address misconceptions; specific, actionable feedback)","d":"Planned checks of every student, affirming and corrective feedback, and time to act on it.","probs":[{"id":"c1","t":"“Does everyone understand?” – nods taken as evidence","ask":"What evidence did you have that most students understood before they started practice?","techs":["mwb","hinge","signals"]},{"id":"c2","t":"Checks only involve volunteers","ask":"Whose understanding did you actually see today? Whose did you have to guess?","techs":["coldCall","mwb","activeMon"]},{"id":"c3","t":"Teacher doesn’t know who is stuck during practice","ask":"Ten minutes into practice, which students were stuck and on what?","techs":["activeMon","showCall","exitTicket"]},{"id":"c4","t":"Misconceptions surface late (end of lesson or when marking)","ask":"When did you first see that error? What question could have revealed it earlier?","techs":["hinge","probe","anticipateMis"]},{"id":"c5","t":"Partially correct answers accepted as correct","ask":"Which answer did you accept that was nearly right? What was missing?","techs":["rightIsRight","exemplar","probe"]},{"id":"c6","t":"Feedback is general or students don’t act on it","ask":"What feedback did students get today? What did they do with it?","techs":["feedbackAct","peerFeedback","showCall"]},{"id":"c7","t":"Students hide errors or are reluctant to share","ask":"How did students react when an error was shared? Whose work got shown?","techs":["normaliseError","showCall","mwb"]}]},{"id":"responsive","el":"expl","n":"Responsive teaching","v":"Monitor progress › Practice 2: Use responsive teaching for all (move between I do, we do, you do; provide additional support; extend and challenge)","d":"Use evidence to move between I do, we do and you do; add support or extend in real time.","probs":[{"id":"rt1","t":"Moves on despite errors, or reteaches the same way louder","ask":"When most boards were wrong, what did you do next? How was the second explanation different?","techs":["respond","exNonEx","workedEx"]},{"id":"rt2","t":"Release to independent practice based on time, not evidence","ask":"What told you students were ready to work on their own?","techs":["iWeYou","respond","hinge"]},{"id":"rt3","t":"Students who need more support aren’t picked up","ask":"Who needed another example today? When did they get it?","techs":["smallGroup","activeMon","cpa"]},{"id":"rt4","t":"Students ready for more aren’t extended","ask":"Who had it early? What did they do next?","techs":["extendPrompts","stretch","openTask"]},{"id":"rt5","t":"No evidence collected to plan the next lesson","ask":"What do you know now about who needs what tomorrow?","techs":["exitTicket","closeLoop","respond"]}]},{"id":"vary","el":"supp","n":"Vary practice & questioning","v":"Vary practice › Practice 1: Use tasks to apply knowledge in varied ways (incl. questions for engagement, explanation and elaboration); Practice 2: Space practice (incl. alternate practice of related content)","d":"Varied tasks and questions, elaborative interrogation, spaced and interleaved practice.","probs":[{"id":"v1","t":"Mostly recall or closed questions","ask":"What kinds of questions did you ask? How many asked students to explain why?","techs":["elaborative","probe","stretch"]},{"id":"v2","t":"Correct answers aren’t extended","ask":"When a student got it right, what happened next? Was there a ‘why’ or a ‘what if’?","techs":["stretch","elaborative","extendPrompts"]},{"id":"v3","t":"One-word or incomplete spoken answers","ask":"What did a typical student answer sound like? Would it pass as written work?","techs":["formatMatters","stems","rightIsRight"]},{"id":"v4","t":"Practice all in one block, then never revisited","ask":"When will students next practise today’s content?","techs":["spaced","dailyReview","interleave"]},{"id":"v5","t":"Students can do it in one form but not transfer it","ask":"Could students do this in a different context or representation?","techs":["varyRep","interleave","openTask"]},{"id":"v6","t":"Practice is blocked – students never choose the method","ask":"Did students have to decide which method to use, or was it obvious from the page?","techs":["interleave","varyRep"]}]},{"id":"review","el":"supp","n":"Revisit & review","v":"Revisit and review › Practice 1: Identify what to revisit, why and how; Practice 2: Consolidate knowledge through retrieval; Practice 3: Teach revision strategies and techniques","d":"Retrieval routines (daily, weekly, monthly) with high response and thinking rates; teach students to self-test.","probs":[{"id":"t1","t":"Students forget learning from previous weeks","ask":"When did students last retrieve this content? What did they get wrong?","techs":["dailyReview","spaced","brainDump"]},{"id":"t2","t":"Review is teacher re-telling, not students recalling","ask":"During the review, who was doing the remembering – you or them?","techs":["quiz","brainDump","mwb"]},{"id":"t3","t":"Retrieval involves only some students","ask":"During review, could every student show you what they remembered?","techs":["quiz","agreeDisagree","mwb","coldCall"]},{"id":"t4","t":"Review runs long and eats into new learning","ask":"How long did the review take? What could be cut?","techs":["dailyReview","quiz"]},{"id":"t5","t":"Students don’t know how to revise independently","ask":"How do students study for a test? What do they do at home?","techs":["selfTest","peerQuiz","brainDump"]}]},{"id":"apply","el":"supp","n":"Apply learning & build mastery","v":"Apply learning and build mastery › Practice 1: Enable knowledge application and mastery (deep learning tasks, open tasks); Practice 2: Guide and support students to apply learning with greater independence","d":"Deep learning and open tasks, modelled problem solving, structured inquiry and group work, metacognitive strategies.","probs":[{"id":"a1","t":"Students don’t know where to start on unfamiliar problems","ask":"What did students do when the problem looked different from the examples?","techs":["modelProblem","metaQ","selfQuestion"]},{"id":"a2","t":"Open or inquiry tasks given before knowledge is secure","ask":"Did students have the knowledge they needed to do the task well?","techs":["openTask","guided","modelProblem"]},{"id":"a3","t":"Group work dominated by a few students","ask":"In each group, who did most of the thinking? How would you know?","techs":["groupWork","partnerships","turnTalk"]},{"id":"a4","t":"Tasks stay at the practice level – little deep application","ask":"Where did students have to select, organise or connect ideas themselves?","techs":["openTask","studentQuestions","varyRep"]},{"id":"a5","t":"Students can’t explain or teach what they’ve learnt","ask":"Could a student explain this to a peer? What would they leave out?","techs":["studentQuestions","elaborative","peerQuiz"]}]}];
const BASE_T={"doNow":{"n":"Entry routine (Do Now)","m":"focus","also":["routines","review"],"src":"VTLM 2.0 – Focus the learning (open lessons with retrieval such as Do Nows); Revisit and review; Teach Like a Champion – Do Now; WalkThrus – entry routines","p":"A short, silent, independent task waiting for students every lesson so learning starts immediately and prior knowledge is activated.","w":"Predictable starts reduce decisions and settling time, and a quick retrieval task primes the knowledge today’s lesson builds on.","steps":[["Prepare it before they arrive","Have 3–5 short questions on the board or a slip on desks before students enter. Same place, same format, every lesson."],["Make it doable alone","Choose content students have been taught (last lesson, last week, last term). No new teaching and no materials hunt."],["Cue it at the door","Greet students and give a one-line prompt: ‘Do Now is on the board – pencils moving.’ Then stop talking."],["Supervise, don’t help","Scan and circulate for the first minute. Acknowledge students who started straight away. Note common errors."],["Review it quickly","Within 3–5 minutes, check answers (choral, boards or cold call), correct errors and link to today’s learning."]],"look":["Most students working within 60 seconds of entry","Room is quiet without repeated reminders","Teacher uses the review to name a misconception before new content"],"pit":["Task too long or too hard – it becomes a lesson","Teacher talks over students while they work","Answers never reviewed, so students stop trying"],"say":"Rehearse the door script and the first 60 seconds: “Good morning – Do Now is on the board. You have four minutes.” Then practise the scan."},"directions":{"n":"Clear, concrete directions (What to Do)","m":"routines","also":["supervision"],"src":"PCMS – Classroom procedures and routines; Teach Like a Champion – What to Do","p":"Give instructions that are specific, observable, sequenced and brief, so students know exactly what to do – and you can see if they’re doing it.","w":"Vague instructions (‘get started’, ‘settle down’) leave students to guess. Concrete steps reduce load and make expectations visible.","steps":[["Get attention first","Signal, pause and wait for eyes and silence before giving any direction."],["Make it concrete and observable","Describe actions you could see: ‘Pencils down, eyes on me’ rather than ‘pay attention’."],["Sequence and chunk","Give steps in order, one to three at a time. Number them on the board for longer tasks."],["Check the directions","Ask a student to repeat them or show with fingers: ‘What’s step 2?’ before releasing students."],["Release and scan","Say ‘Go’, then scan for the first few seconds and quietly narrate students who are following the steps."]],"look":["Instructions under 30 seconds","Students start without asking ‘what do we do?’","Teacher checks directions before release"],"pit":["Giving directions while students are still moving or talking","Too many steps at once","Not checking, then repeating to individuals"],"say":"Write the directions for the next task as 3 numbered, observable steps. Say them aloud in under 20 seconds."},"transitions":{"n":"Rehearsed transitions","m":"routines","also":["supervision"],"src":"PCMS – Classroom procedures and routines; Teach Like a Champion – tight transitions; WalkThrus – routines","p":"Teach, practise and time the moves between activities (floor to desks, books out, packing up) until they are fast and automatic.","w":"Every minute saved on transitions is learning time. A practised routine frees attention for the content.","steps":[["Pick one transition","Choose the one that costs most time. Break it into 2–4 clear steps (e.g. stand, push chair in, walk to mat, sit facing board)."],["Model it","Show the class exactly what it looks and sounds like, including the noise level."],["Practise with a timer","Have the class practise it. Time it, give specific feedback, then try again to beat it."],["Use a consistent cue","Same words or signal each time: ‘When I say go… ’ or a count."],["Maintain and re-teach","Acknowledge success and quickly re-rehearse if it slips – practise, don’t lecture."]],"look":["Transition under the agreed time","Students follow steps without individual prompts","Teacher uses the same cue each time"],"pit":["Explaining the routine but never practising it","Practising once, then never maintaining","Giving content instructions mid-transition"],"say":"In the debrief, script the steps and the cue, then walk the coach through the transition as if they are the class."},"attention":{"n":"Attention signal – Signal, Pause, Scan","m":"routines","also":["supervision"],"src":"PCMS – Classroom procedures and routines; Teach Like a Champion – Strong Voice; PCMS – procedures and routines","p":"A consistent signal for whole-class attention, followed by a pause and scan, so you only speak when everyone is ready to listen.","w":"Talking over noise teaches students they don’t need to attend the first time. A reliable signal saves time and voice.","steps":[["Choose one signal","A phrase, chime or raised hand – keep it the same and teach what students do (stop, face, listen)."],["Signal once","Give the signal once, in a calm voice. Avoid repeating it louder."],["Pause and stand still","Stop moving and wait. Silence is a powerful cue."],["Scan the room","Look at every corner. Use a non-verbal nudge or name a student’s action quietly if needed."],["Begin only when ready","Start speaking once you have 100%. Acknowledge the quick response briefly."]],"look":["Signal given once, not repeated","Teacher waits for full attention before speaking","Response time is decreasing across lessons"],"pit":["Starting to talk at 80% attention","Multiple signals that mean the same thing","Shouting over the room"],"say":"Practise the signal–pause–scan aloud. Coach plays a slow-to-respond student; teacher practises waiting and a non-verbal prompt."},"precorrect":{"n":"Pre-correction","m":"behaviour","also":["supervision","routines"],"src":"PCMS – Encouraging expected classroom behaviour (prompts and precorrection); Positive Classroom Management Strategies – pre-correction & active supervision","p":"Remind students of the expected behaviour just before a moment where errors are likely, so they get it right first time.","w":"It is easier to prevent an error than to correct one. Pre-correction makes success more likely for students who struggle with routines.","steps":[["Spot the predictable moment","Identify when problems usually happen (group work, materials, transitions, pack-up)."],["Name the expectation briefly","Just before it, state the 1–2 behaviours you want: ‘When you get the materials, one person per table, walking.’"],["Check it","Ask a student to repeat it or point to the visual prompt."],["Watch the start","Scan as the activity begins and acknowledge students meeting the expectation."],["Follow up","Give specific feedback afterwards. If it went well, say so; if not, re-teach before next time."]],"look":["Reminder given before (not after) the tricky moment","Short and specific","Followed by positive acknowledgement"],"pit":["Pre-correcting with a long lecture","Using it only after things go wrong","Being vague (‘be sensible’)"],"say":"List the two predictable hot spots in tomorrow’s lesson and script a one-sentence pre-correction for each."},"circulate":{"n":"Move – Scan – Interact","m":"supervision","also":["cfu"],"src":"PCMS – Active supervision; Positive Classroom Management Strategies – active supervision (move, scan, interact)","p":"Purposeful movement around the room, frequent scanning and brief positive interactions to monitor behaviour and learning.","w":"Proximity and visibility prevent off-task behaviour and let you offer help early. Unpredictable movement covers the whole room.","steps":[["Plan your pathway","Arrange the room so you can reach every student. Plan where you’ll go first (often students who need early support)."],["Move unpredictably","Vary your route so every area gets visited. Avoid staying at one table for long."],["Scan constantly","Every few seconds, look up and around – even while helping an individual. Position yourself facing most of the room."],["Interact briefly","Short check-ins: acknowledge effort, ask a quick question, give a quick prompt – then move on."],["Respond early and quietly","Use proximity, a look or a quiet word at the first sign of drift, before it spreads."]],"look":["Teacher visits all areas of the room","Scans while helping individuals","Positive interactions outnumber corrective ones"],"pit":["Getting stuck in long conferences with one student","Back to the class when helping","Moving only to correct behaviour"],"say":"Sketch the room. Mark a route and two ‘scan points’. Practise kneeling to help while facing the class."},"praise":{"n":"Specific positive feedback","m":"behaviour","also":["supervision","inclusive"],"src":"PCMS – Encouraging expected classroom behaviour (specific praise); Positive Classroom Management Strategies – encouraging expected behaviour; Teach Like a Champion – Precise Praise","p":"Acknowledge expected behaviour and effort by naming exactly what the student did, so it is more likely to be repeated.","w":"Specific feedback teaches what ‘good’ looks like. Generic praise is pleasant but carries little information.","steps":[["Know what you’re looking for","Decide which expected behaviours you want to grow (e.g. starting straight away, using the sentence stem)."],["Catch it early","Look for students doing it – especially those who often struggle."],["Name the behaviour","Say what they did: ‘You started the first question without being asked.’"],["Link to purpose (optional)","Briefly say why it matters: ‘…that gives you more practice time.’"],["Keep the ratio high","Aim for many more positive than corrective interactions. Keep a quick tally if needed."]],"look":["Feedback names a specific action","Spread across students, including those often corrected","More positive than corrective interactions"],"pit":["Praising everything equally (‘amazing!’)","Praising ability rather than effort or action","Only acknowledging the same students"],"say":"Rewrite three generic comments from the lesson as specific ones. Practise saying them in a calm, matter-of-fact tone."},"positiveFraming":{"n":"Positive framing","m":"behaviour","also":["routines"],"src":"Teach Like a Champion – Positive Framing","p":"Correct and redirect by describing the behaviour you want to see next, rather than dwelling on what went wrong.","w":"Framing the next step keeps the tone calm and the momentum high, and tells students exactly how to get it right.","steps":[["Describe the next step","Say what you want: ‘Pens down and eyes this way’ rather than ‘Stop fiddling’."],["Narrate the positive","Point out students already doing it: ‘I can see this row is ready.’"],["Assume the best","Treat errors as forgetting, not defiance: ‘Some of us forgot – check your page number.’"],["Use anonymous correction first","Address the group before naming individuals when possible."],["Keep moving","Correct briefly then return to the learning – avoid long pauses on behaviour."]],"look":["Corrections describe what to do","Calm, warm, business-like tone","Learning resumes quickly"],"pit":["Sarcasm or rhetorical questions (‘Why are you talking?’)","Narrating the positive in a pointed, passive-aggressive way","Over-using it instead of addressing persistent issues"],"say":"List three corrections you used today. Rewrite each as a ‘what to do next’ instruction and rehearse them."},"leastInvasive":{"n":"Least invasive correction","m":"behaviour","also":["supervision"],"src":"PCMS – Discouraging inappropriate behaviour (indirect responses); Teach Like a Champion – Least Invasive Intervention; PCMS – responding to behaviour errors","p":"Use the smallest, quickest correction that will work, so the lesson keeps flowing for everyone else.","w":"Big public corrections disrupt the class and can escalate. Small, private moves usually fix the problem with less cost.","steps":[["Start non-verbal","A look, a gesture or a pointed finger to the page."],["Use proximity","Move towards the student while continuing to teach."],["Group reminder","Give an anonymous whole-class reminder of the expectation."],["Quiet private word","Lean in and say the expected behaviour briefly, then walk away."],["Follow through calmly","If needed, apply the agreed school consequence privately and without debate. Re-connect positively later."]],"look":["Most corrections are non-verbal or private","Teaching continues while correcting","Escalation is rare"],"pit":["Jumping straight to a public warning","Arguing or explaining at length","Giving attention that rewards the behaviour"],"say":"Coach plays a student swinging on a chair; teacher practises moving through steps 1–4 without stopping the explanation."},"coldCall":{"n":"Cold call (invite to share)","m":"otr","also":["cfu","inclusive"],"src":"PCMS – Opportunities to respond (verbal responses such as cold calling); VTLM 2.0 – Monitor progress; Teach Like a Champion – Cold Call; WalkThrus – cold calling","p":"Ask the whole class, let everyone respond first (turn and talk, mini whiteboards or writing), then choose a student and invite them to share – so every student thinks and knows you genuinely want to hear their ideas.","w":"Because anyone might be invited to share, everyone thinks and prepares an answer. Choosing students warmly tells them their thinking matters – and gives you evidence from students who would rarely volunteer.","steps":[["Ask everyone","Pose the question to the whole class. Every student is expected to think about it."],["Everyone responds first","Use a response technique – turn and talk, mini whiteboards or everybody writes – so every student has an answer ready."],["Choose who shares","Decide whose thinking you want to hear, including students who rarely put their hand up. You choose; it isn’t left to chance."],["Invite them to share","Use warm, inviting language. The question has already been asked and answered by everyone, so the name can come first or after the prompt: “Ethan, why don’t you kick us off?” · “Stacey, what were your thoughts about…?” · “What was the answer to question 3 … Willow?”"],["Build on it","Thank them, build on the answer and invite others to add, agree or challenge. If the answer is incomplete, come back to the student once it’s clearer (see No opt out)."]],"look":["The question goes to the whole class first","Everyone responds (talk, boards or writing) before anyone shares","The teacher chooses who shares, across a wide range of students","Invitations are warm and curious, not a ‘gotcha’"],"pit":["Inviting a student before the class has had time to think or respond","Using it to catch students who aren’t listening","Leaving the choice to chance instead of deciding whose thinking to hear","Only inviting students you know will be right"],"say":"Plan three questions and the response technique for each (pairs, boards or writing). Rehearse: ask – everyone responds – choose – invite to share. Try the invitation scripts aloud while the coach plays the students."},"choral":{"n":"Choral response (call and response)","m":"otr","also":["explain","focus"],"src":"VTLM 2.0 – Revisit and review (call and response); Teach Like a Champion – Call and Response; WalkThrus – choral response","p":"The whole class says a short answer together on a cue, to rehearse key vocabulary, facts or steps.","w":"It gives every student a quick, low-risk response and builds fluency with key terms. It works best for short, single correct answers.","steps":[["Choose short, exact answers","Key words, facts, definitions or steps – one right answer."],["Teach the cue","E.g. ‘My turn… your turn’, or ‘Everyone… [hand signal]’."],["Model first","Say it correctly yourself, then cue the class to repeat."],["Listen and hold the standard","If it’s weak or some don’t join in, say ‘Again, everyone’ until it’s crisp."],["Follow with individuals","Check a few individuals afterwards to confirm it has stuck."]],"look":["Clear cue, crisp unison response","All students participate","Used for short, closed content"],"pit":["Using it for complex or open questions","Accepting a mumbled response","Never checking individuals"],"say":"Pick 3 key terms from tomorrow’s lesson. Rehearse the my-turn/your-turn cue with the coach."},"mwb":{"n":"Mini whiteboards (Show Me)","m":"otr","also":["cfu","review"],"src":"PCMS – Opportunities to respond (written responses such as mini whiteboards); VTLM 2.0 – Monitor progress; WalkThrus – show-me boards; Teach Like a Champion – Show Me","p":"Every student writes an answer and shows it at the same time, so you can see the whole class’s understanding in seconds.","w":"Simultaneous responses make thinking visible for all students and reveal errors you can act on immediately.","steps":[["Set up the routine","Boards, pens and wipers ready. Teach ‘write, hide, wait’ and ‘3-2-1 show’."],["Ask a focused question","One that has a short answer and reveals understanding (or a likely misconception)."],["Give thinking time, then show together","Count down; all boards up at once, facing you, held until you say so."],["Scan and read the room","Look at every board. Note patterns: how many right, which errors."],["Respond to what you see","Praise specific good answers, address common errors, re-explain or move on (see Respond)."]],"look":["All boards up simultaneously","Teacher actually scans every board","Next teaching move changes based on what boards show"],"pit":["Students showing whenever they’re ready (copying)","Glancing without reading","Questions too open to read quickly"],"say":"Plan two board questions for the next lesson – one fluency, one diagnostic. Decide in advance: what will you do if fewer than 80% are correct?"},"signals":{"n":"Hand signals & hinge votes","m":"otr","also":["cfu"],"src":"PCMS – Opportunities to respond (non-verbal responses such as hand signals); VTLM 2.0 – Monitor progress; VTLM 2.0 – monitor progress (hand signals); WalkThrus – multiple-choice hinge","p":"Quick non-verbal responses – thumbs, fingers for A/B/C/D, true/false – so every student commits to an answer at once.","w":"Fast, whole-class evidence with no materials. Best for true/false, examples vs non-examples or multiple-choice.","steps":[["Choose the right format","True/false, example/non-example, or 4-option multiple choice with fingers."],["Teach the signal","Show what each signal means. Signals held close to the chest so peers don’t copy."],["Think, then show together","Give thinking time; count down; everyone shows at once."],["Scan and count","Quickly note how many chose each option."],["Act on it","Ask students to justify, re-teach the confused idea, or move on."]],"look":["Everyone signals at the same time","Teacher counts and responds","Used for closed, diagnostic questions"],"pit":["Thumbs up for ‘do you understand?’ (self-report, not evidence)","Signals visible to peers","No follow-up"],"say":"Turn two ‘does everyone get it?’ moments into a true/false or ABCD signal question."},"turnTalk":{"n":"Structured turn and talk","m":"otr","also":["cfu","inclusive"],"src":"VTLM 2.0 – Explicit explanation and Monitor progress (turn-and-talk); Teach Like a Champion – Turn and Talk; WalkThrus – think-pair-share","p":"Short, tightly structured partner talk with a clear prompt, roles and time, so every student rehearses their thinking aloud.","w":"Every student talks, not just one. Rehearsing ideas aloud improves quality of later answers and writing.","steps":[["Set fixed partners","Assign talk partners in advance (e.g. A and B) so there is no negotiation."],["Give a precise prompt","Ask a specific question and a sentence stem if needed: ‘The character changed because…’."],["Assign who goes first","‘Partner A starts, 30 seconds each.’ Then cue ‘Go’."],["Listen in","Circulate and listen to 2–3 pairs to collect strong answers and misconceptions."],["Bring it back crisply","Use a signal to end, then cold call pairs to share – using what you heard."]],"look":["Both partners speak","Talk is on the prompt","Teacher uses what they heard in the follow-up"],"pit":["Vague prompts (‘discuss’)","Talk time too long – drift","Not following up, so talk feels optional"],"say":"Script one turn and talk: prompt, stem, who starts, time, and the follow-up cold call."},"everybodyWrites":{"n":"Everybody writes","m":"otr","also":["cfu"],"src":"Teach Like a Champion – Everybody Writes; WalkThrus – think time","p":"Before discussion, every student writes a brief response, so all students think deeply and have something to say.","w":"Writing makes thinking concrete and gives quieter students a prepared answer. It also gives the teacher evidence to circulate and read.","steps":[["Ask a question worth thinking about","One that needs more than recall."],["Set a short time and length","‘One minute, at least one full sentence.’"],["Circulate and read","Look over shoulders; spot strong answers and errors to use later."],["Use the writing","Cold call students to read or build on what they wrote."],["Revise","Optionally ask students to improve their answer after the discussion."]],"look":["All students writing","Teacher reads responses while circulating","Discussion draws on written answers"],"pit":["Too long – students run out of ideas","Not using the writing afterwards","Prompts that are too closed"],"say":"Choose one point in the lesson where everybody writes. Draft the prompt and the follow-up question."},"waitTime":{"n":"Wait time","m":"otr","also":["vary"],"src":"Teach Like a Champion – Wait Time; WalkThrus – think time","p":"Deliberately pause after asking a question (and after an answer) so more students can think and answers improve.","w":"Taking the first hand rewards speed, not thinking. A few seconds of silence increases the number and quality of responses.","steps":[["Ask the question","Pose it clearly to the whole class."],["Pause 3–5 seconds","Count silently. Resist re-phrasing or answering it yourself."],["Narrate the thinking time","‘I’ll give everyone a few seconds… I can see people jotting ideas.’"],["Then select a student","Cold call or use another means of participation."],["Pause after answers too","Wait after a response to let the student extend it or others react."]],"look":["Consistent pause after questions","More students ready to respond","Longer, better answers"],"pit":["Filling silence with more talk","Re-asking the question in different words","Taking the first hand up"],"say":"Practise asking three questions with a silent 5-second count. Coach times it."},"noOptOut":{"n":"No opt out","m":"otr","also":["inclusive"],"src":"Teach Like a Champion – No Opt Out","p":"When a student can’t answer, support them to reach the correct answer – a sequence that starts with ‘I don’t know’ ends with them answering.","w":"Students learn that ‘I don’t know’ is the beginning of learning, not an exit, and every student ends with success.","steps":[["Respond warmly","Acknowledge: ‘That’s okay, let’s work it out.’"],["Get the answer elsewhere or give a cue","Ask another student, give a hint, or point to the model."],["Return to the original student","Ask the same student to give the answer now."],["Have them say it fully","Ask for the complete correct answer, not just ‘yes’."],["Acknowledge and move on","Briefly recognise the success, then continue."]],"look":["Students who say ‘I don’t know’ finish by answering","Warm, low-stakes tone","Quick – doesn’t stall the lesson"],"pit":["Moving on after ‘I don’t know’","Making it feel punitive","Over-prompting so the student just echoes"],"say":"Coach says ‘I don’t know’ to three questions; teacher practises the three ways back (peer, cue, model)."},"means":{"n":"Means of participation","m":"otr","also":["routines"],"src":"Teach Like a Champion – Means of Participation","p":"Tell students how to respond before you ask the question – cold call, choral, boards, turn and talk or hands up.","w":"Clear response expectations reduce calling out and confusion, and let you choose the method that gives the evidence you need.","steps":[["Plan the method per question","Decide in advance which questions are cold call, choral, boards or pair talk."],["Announce it first","‘In a moment, on your whiteboards…’ or ‘Hands down, I’ll choose.’"],["Ask the question","Then wait for responses in that format."],["Hold the expectation","Redirect calling out back to the stated method."],["Vary deliberately","Use the method that matches the question and the evidence you want."]],"look":["Students know how to respond before the question","Little calling out","Variety of methods used purposefully"],"pit":["Asking first, then deciding","Defaulting to hands up","Inconsistent enforcement"],"say":"Annotate the next lesson’s questions with a method (CC, CH, MWB, T&T)."},"dailyReview":{"n":"Review routines (daily, weekly, monthly)","m":"review","also":["focus"],"src":"VTLM 2.0 – Revisit and review (daily, weekly and monthly review routines); Rosenshine – daily review; WalkThrus – retrieval practice","p":"A brief, regular review of previously taught content at the start of the lesson, so key knowledge stays accessible and fluent.","w":"New learning depends on prior knowledge. Regular recall strengthens memory and reveals gaps before they grow.","steps":[["Select what to review","Mix last lesson, last week and earlier content – especially what today depends on."],["Students do the recalling","Questions, not re-telling: boards, quick quiz or choral for facts."],["Keep it short and routine","5–10 minutes daily; add a weekly and monthly review of older content."],["Check all students","Use boards or a written task to see everyone’s recall."],["Close the gaps","Re-explain what was weak and plan to revisit it again soon."]],"look":["Students retrieving, not listening","Spaced content, not just yesterday","Teacher responds to gaps"],"pit":["Teacher re-explains instead of questioning","Only reviewing yesterday","Running long and eating the lesson"],"say":"Plan tomorrow’s review: 2 questions from last lesson, 2 from last week, 1 from last term."},"lisc":{"n":"Learning intentions & success criteria in use","m":"focus","src":"VTLM 2.0 – focus the learning; WalkThrus – learning intentions","p":"Share a clear learning intention and success criteria that break the learning into steps – and return to them during the lesson.","w":"Students attend better when they know what they are learning and what ‘good’ looks like. Success criteria chunk the learning into manageable steps.","steps":[["Write it in student language","What are we learning? Keep it specific to today."],["Make success criteria the steps","List the 2–4 steps or features students need (‘I can…’)."],["Show what success looks like","Link criteria to a model or worked example."],["Refer back during practice","Point to criteria when giving feedback: ‘You’ve done 1 and 2 – check 3.’"],["Use them to check","Close with a task that shows whether students met them."]],"look":["Students can explain the LI/SC in their words","Criteria are steps, not activities","Teacher refers to them mid-lesson"],"pit":["Copying the LI off the board as a ritual","Criteria that describe the task, not the learning","Never returning to them"],"say":"Rewrite tomorrow’s success criteria as the actual steps of the model.","also":[]},"chunking":{"n":"Small steps & chunking","m":"explain","also":["focus","scaffold"],"src":"VTLM 2.0 – Explicit explanation (concise, small steps); Rosenshine – small steps; WalkThrus – chunking; VTLM 2.0 – explain in concise, small steps","p":"Break new material into small, logical steps and check understanding after each one before moving on.","w":"Working memory is limited. Small steps with practice prevent overload and let you catch problems early.","steps":[["Identify the steps","List the essential pieces of knowledge or steps in order. Cut anything non-essential."],["Teach one step","Explain concisely with an example. Keep it brief."],["Check it","Quick check for understanding (boards, cold call) on that step."],["Practise briefly","Students try it before the next step is added."],["Build and connect","Add the next step and show how it connects to the first."]],"look":["Short explanation segments with checks between","Content trimmed to essentials","Students practise each step"],"pit":["Long explanation followed by one check at the end","Including interesting but non-essential detail","Too many new terms at once"],"say":"Take today’s explanation and split it into steps. Mark where each CFU goes."},"thinkAloud":{"n":"Think aloud modelling","m":"explain","also":["scaffold","selfreg"],"src":"VTLM 2.0 – narrate your thought processes; WalkThrus – modelling","p":"Narrate the expert decisions, questions and checks you make as you complete a task, so students can see the invisible thinking.","w":"Novices see what experts do but not why. Thinking aloud makes the decision-making visible and copyable.","steps":[["Plan the key decisions","Before the lesson, list the 3–4 decisions an expert makes in this task."],["Say what you’re thinking","Use first person: ‘First I ask myself… ’, ‘I notice… so I’ll…’"],["Highlight the checks","Show how you check your work: ‘Does this make sense? Let me check by…’"],["Show a common error","Make and fix a likely mistake aloud."],["Hand it over","Ask students to talk through the next one using the same questions."]],"look":["Teacher verbalises decisions, not just steps","Self-checking modelled","Students reuse the same questions"],"pit":["Narrating actions only (‘now I write the number’)","Too fast, too much at once","No opportunity for students to try the thinking"],"say":"Script the think-aloud for one model: write the actual sentences you’ll say at each decision point."},"workedEx":{"n":"Worked examples & problem pairs","m":"explain","also":["scaffold"],"src":"VTLM 2.0 – Explicit explanation (Model with worked examples); WalkThrus – worked examples; Cognitive Load Theory – worked example effect","p":"Present a fully worked example step by step, then immediately give a similar problem for students to try.","w":"Studying worked examples reduces cognitive load for novices and helps them form a model of the process before solving alone.","steps":[["Choose a clear example","Typical, not tricky. All steps visible."],["Walk through each step","Explain why each step is done. Label the steps."],["Pair it with a similar problem","Give an almost identical problem straight away."],["Check the attempt","Boards or circulating to see who can replicate it."],["Increase variation","Gradually change the surface features or remove steps (completion problems)."]],"look":["Example stays visible while students practise","Immediate paired practice","Steps labelled and explained"],"pit":["Example erased before practice","Paired problem too different","Only one example for a complex process"],"say":"Build one example–problem pair for tomorrow and decide what changes in pair 2 and 3."},"exNonEx":{"n":"Examples & non-examples","m":"explain","also":["cfu"],"src":"VTLM 2.0 – examples and non-examples; WalkThrus – concrete examples","p":"Define the concept with carefully chosen examples and close non-examples, so students learn its boundaries.","w":"Examples alone can lead to over-generalising. Non-examples that differ by one feature sharpen the concept.","steps":[["Define the concept","Give a clear, concise definition with critical features."],["Show varied examples","Different surface features, same critical features."],["Show close non-examples","Ones that look similar but lack a critical feature."],["Students sort and justify","‘Example or non-example? How do you know?’ (signals or boards)."],["Test the edge cases","Present tricky cases and ask students to apply the definition."]],"look":["Non-examples included","Students justify using the definition","Misconceptions surfaced and addressed"],"pit":["Only showing obvious examples","Non-examples too different to be useful","Not asking for justification"],"say":"For tomorrow’s concept, write 3 examples and 3 close non-examples. Plan the sorting question."},"dualCoding":{"n":"Dual coding – say it and show it","m":"explain","src":"VTLM 2.0 – Explicit explanation (cut distractions such as busy slides); WalkThrus – dual coding; Cognitive Load Theory – split attention","p":"Combine spoken explanation with a simple, clear visual (diagram, timeline, number line) and keep slides uncluttered.","w":"Words and visuals processed together strengthen understanding. Clutter and reading text while listening split attention.","steps":[["Choose a simple visual","A diagram, flow or timeline that shows structure."],["Remove the clutter","Cut text from slides; no decorative images."],["Build it as you talk","Draw or reveal it step by step while explaining."],["Point and pause","Point to the part you’re explaining; don’t talk over text students are reading."],["Have students use it","Ask students to recreate or explain from the visual."]],"look":["Minimal text on slides","Teacher builds the visual live","Students refer to the visual"],"pit":["Reading slides aloud","Decorative images","Visuals that don’t match the explanation"],"say":"Redesign one slide from today: cut it to a single diagram plus key words.","also":[]},"iWeYou":{"n":"I do – We do – You do","m":"responsive","also":["scaffold","explain"],"src":"VTLM 2.0 – scaffold practice; WalkThrus – gradual release","p":"Move deliberately from teacher modelling, to guided practice together, to independent practice – checking before each release.","w":"Gradual release protects students from failing early, while building towards independence.","steps":[["I do","Model with a worked example and think aloud. Students watch and listen."],["We do (teacher-led)","Complete one together: students contribute steps; you write."],["We do (student-led)","Students do the next one on boards while you check and correct."],["Check readiness","Use a CFU – only release when most students succeed."],["You do","Students practise independently while you monitor and support."]],"look":["Clear phases visible","Release based on evidence, not time","High success in independent practice"],"pit":["Skipping ‘we do’","Releasing everyone at once regardless of evidence","Too many ‘I do’ examples without student involvement"],"say":"Plan the we-do problem and the readiness check. Decide what happens for students who aren’t ready."},"guided":{"n":"Guided practice with high success","m":"scaffold","also":["responsive"],"src":"VTLM 2.0 – Scaffold practice; Rosenshine – guide student practice; VTLM 2.0 – scaffold practice","p":"Practise together with prompts and quick feedback until most students are getting it right before independent work.","w":"Errors practised become habits. High success during guided practice builds accuracy and confidence.","steps":[["Start with similar problems","Close to the model, so success is likely."],["Prompt and question","Ask students to explain each step as they do it."],["Check every few problems","Boards or circulating to see accuracy."],["Correct immediately","Fix errors straight away; re-model if needed."],["Aim for ~80% success","Release when most succeed; keep a small group for more guided practice."]],"look":["Most students correct before release","Errors corrected quickly","Small group kept for extra support"],"pit":["One quick example then release","Feedback delayed until marking","Practice too hard too soon"],"say":"Write 3 guided practice items that step up gradually and plan where you’ll check."},"fade":{"n":"Fade the scaffolds","m":"scaffold","also":["responsive"],"src":"VTLM 2.0 – Scaffold practice (Reduce or remove scaffolds); WalkThrus – scaffolding; Cognitive Load Theory – expertise reversal","p":"Plan how supports (sentence stems, partial worked examples, prompts) will be gradually removed as students gain fluency.","w":"Supports that help novices can slow down students who are ready to work independently.","steps":[["Name the scaffolds","List supports in use: stems, steps on board, completion problems, manipulatives."],["Plan the fade","Decide the order of removal across lessons."],["Remove one at a time","E.g. full example → partial example → no example."],["Check it holds","See whether accuracy stays high without the support."],["Offer it back selectively","Keep scaffolds available for individuals who need them."]],"look":["Scaffold use decreases across lessons","Independent accuracy maintained","Supports targeted to individuals"],"pit":["Same scaffolds for everyone, forever","Removing all at once","No check on readiness"],"say":"Map the scaffolds across the sequence: what goes first, second, third?"},"independent":{"n":"Independent practice routine (when I’m stuck)","m":"scaffold","also":["selfreg"],"src":"Rosenshine – independent practice; Teach Like a Champion – habits of independence","p":"Structured independent practice with a clear ‘what to do when stuck’ routine, so students keep working and you can monitor.","w":"Independent practice builds fluency, but only if students stay productive. A stuck routine stops queues forming.","steps":[["Set clear expectations","Silent or quiet, how many, what to do when finished."],["Teach a stuck routine","E.g. re-read, check the model, try the next one, mark it to ask."],["Leave the model up","Keep the worked example visible."],["Monitor, don’t queue","Circulate to students rather than having them come to you."],["Plan for finishers","Extension tasks ready that deepen, not just ‘more of the same’."]],"look":["Students productive for extended periods","No queue at the teacher","Worked example visible"],"pit":["Students waiting for help","Finishers drift","No accountability for completion"],"say":"Write the stuck routine as a 3-step poster and rehearse explaining it in 30 secon
