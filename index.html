 all("[data-ag]",el=>{const f=()=>{const t=agreeT||D.teacher;const a=agreements[akey(t)]||(agreements[akey(t)]=agreeBlank(t));const k=el.dataset.ag;
  if(k.startsWith("items."))a.items[k.slice(6)]=el.checked;else a[k]=el.type==="number"?+el.value:el.value;persistAgreements()};el.oninput=f;el.onchange=f});
 all("[data-ev]",b=>b.onclick=()=>{const k=b.dataset.ev;D.evidence=D.evidence||["live"];D.evidence=D.evidence.includes(k)?D.evidence.filter(x=>x!==k):D.evidence.concat(k);saveDraft();rerenderKeep()});
 all("[data-reh]",b=>b.onclick=()=>{const [id,i]=b.dataset.reh.split("|");const p=D.plans[id];p.reh=p.reh||{};p.reh[i]=!p.reh[i];if(!p.reh[i])delete p.reh[i];if(Object.keys(p.reh).length)p.rehearsed=true;saveDraft();rerenderKeep()});
 all("[data-emb]",b=>b.onclick=()=>{const [id,s]=b.dataset.emb.split("|"),i=+s;const p=D.plans[id];p.emb=p.emb||[];p.emb=p.emb.includes(i)?p.emb.filter(x=>x!==i):p.emb.concat(i);saveDraft();rerenderKeep()});
 all("[data-ck]",b=>b.onclick=()=>{const [id,i,k]=b.dataset.ck.split("|");D.check=D.check||{};D.check[id]=D.check[id]||{};D.check[id][i]=D.check[id][i]===k?undefined:k;if(!D.check[id][i])delete D.check[id][i];saveDraft();rerenderKeep()});
 all("[data-prio]",b=>b.onclick=()=>{D.priority=b.dataset.prio;saveDraft();rerenderKeep()});
 const at=$("#agTeacher");if(at){at.focus();at.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();actAlign("agreeteacher")}}}

function actAlign(x){
 if(x==="agreeopen"){agreeT=D.teacher;setView("agree");return true}
 if(x==="agreeteacher"){const n=($("#agTeacher").value||"").trim();if(!n){toast("Enter the teacher’s name first.");return true}
  D.teacher=n;const a=agreementFor(n);if(a&&!D.coach)D.coach=a.coach||"";if(a&&a.model)D.model=a.model;ctxOpen=false;saveDraft();agreeT=n;
  if(a){toast(`Agreement with ${esc(n)} is in place – on to Identify.`);step=0;setView("debrief")}else setView("agree");return true}
 if(x==="agreeback"){if(!agreeT&&!D.teacher){setView("home");return true}setView(D.teacher&&akey(D.teacher)===akey(agreeT)?"debrief":"saved");return true}
 if(x==="agreesave"){const t=agreeT||D.teacher;const isNew=!agreements[akey(t)];if(isNew){agreements[akey(t)]=agreeBlank(t);persistAgreements()}const a=agreements[akey(t)];
  if(akey(D.teacher)===akey(t)){if(!D.coach)D.coach=a.coach||"";if(a.model&&(!D.model||D.model==="one"))D.model=a.model;saveDraft();if(isNew)toast("Coaching agreement saved.");step=0;setView("debrief")}else{toast("Coaching agreement saved.");setView("saved")}return true}
 if(x==="agreedoc"){const t=agreeT||D.teacher;if(!agreements[akey(t)]){agreements[akey(t)]=agreeBlank(t);persistAgreements()}downloadDocx(`${today()} ${cleanName(t)} – coaching agreement.docx`,agreeSheet(t),`${t} – coaching agreement`).then(ok=>ok&&toast("Agreement downloaded as a Word document.",4000));return true}
 if(x==="addreview"){const t=agreeT||D.teacher,a=agreements[akey(t)];if(!a)return true;a.reviews=a.reviews||[];a.reviews.push({date:today(),decision:$("#rvDec").value,note:$("#rvNote").value});persistAgreements();rerenderKeep();toast("Review recorded.");return true}
 return false;

/* =====================================================================
   SHAREPOINT SAVING (synced folder via File System Access API + web link)
   ===================================================================== */
const fsSupported=()=>{try{return typeof window.showDirectoryPicker==="function"&&window.self===window.top}catch(e){return false}};
let spRoot=null, spLoaded=false;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("cdp-save",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kv(op,key,val){try{const db=await idb();return await new Promise((res,rej)=>{const tx=db.transaction("kv",op==="get"?"readonly":"readwrite"),st=tx.objectStore("kv");const r=op==="get"?st.get(key):op==="del"?st.delete(key):st.put(val,key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return undefined}}
async function loadRoot(){if(!spLoaded){spRoot=(await kv("get","root"))||null;spLoaded=true}return spRoot}
async function permitted(h,ask){if(!h)return false;if(!h.queryPermission)return true;const o={mode:"readwrite"};if((await h.queryPermission(o))==="granted")return true;return ask?(await h.requestPermission(o))==="granted":false}
async function connectFolder(){const h=await window.showDirectoryPicker({id:"cdp-coaching",mode:"readwrite"});spRoot=h;spLoaded=true;await kv("put","root",h);return h}
async function childDir(dir,name){const lower=name.toLowerCase();for await(const [n,h] of dir.entries()){if(h.kind==="directory"&&n.toLowerCase()===lower)return h}return dir.getDirectoryHandle(name,{create:true})}
async function writeTo(segs,filename,content){
 if(!(await permitted(spRoot,true)))throw new Error("permission");
 const blob=content instanceof Blob?content:new Blob([content],{type:"text/html"});
 const walk=async()=>{let d=spRoot;const real=[spRoot.name];for(const s of segs){d=await childDir(d,s);real.push(d.name)}return {d,real}};
 const put=async(d,name)=>{const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable({keepExistingData:false});try{await w.write(blob);await w.close()}catch(e){try{await w.abort()}catch(_){}throw e}};
 let {d,real}=await walk();let existed=false;try{await d.getFileHandle(filename);existed=true}catch(e){}
 try{await put(d,filename);return {existed,path:[...real,filename]}}catch(e1){
  // OneDrive may be syncing the old copy, or it is open in Word: wait, look the folder up again and retry
  await new Promise(r=>setTimeout(r,1200));
  try{({d,real}=await walk());try{await d.removeEntry(filename)}catch(_){}await put(d,filename);return {existed,path:[...real,filename]}}catch(e2){
   const dot=filename.lastIndexOf("."),stem=dot>0?filename.slice(0,dot):filename,ext=dot>0?filename.slice(dot):"";
   for(let i=2;i<10;i++){const alt=`${stem} (${i})${ext}`;try{await d.getFileHandle(alt);continue}catch(_){}
    try{await put(d,alt);return {existed,renamed:true,path:[...real,alt]}}catch(e3){}}
   throw e2}}
}
function spTeacherLink(teacher){
 let base=(settings.spUrl||"").trim();if(!base)return "";
 const name=cleanName(teacher);
 try{
  const u=new URL(base);
  const idp=u.searchParams.get("id");if(idp){const id=idp.replace(/\/+$/,"")+(name?"/"+name:"");const rest=[...u.searchParams.entries()].filter(([k])=>k!=="id").map(([k,v])=>"&"+encodeURIComponent(k)+"="+encodeURIComponent(v)).join("");return u.origin+u.pathname+"?id="+encodeURIComponent(id)+rest}
  base=base.replace(/\/+$/,"");return name?base+"/"+encodeURIComponent(name):base;
 }catch(e){return ""}
}
function recordFilename(d){return `${d.date||today()} ${cleanName(d.teacher)||"Teacher"} – Blueprint record.html`}
function cardFilename(d){return `${d.date||today()} ${cleanName(d.teacher)||"Teacher"} – action card.html`}
function convFilename(d){return `${d.date||today()} ${cleanName(d.teacher)||"Teacher"} – coaching conversation.html`}
async function saveToSharePoint(d){
 if(!d.teacher||!d.teacher.trim()){showModal(`<h2>Add the teacher’s name first</h2><p>The teacher’s name is used for the SharePoint folder. Add it in step 1 (Context).</p><div class="row"><button class="btn hi" data-mclose data-goStep1>Go to step 1</button><button class="btn alt" data-mclose>Cancel</button></div>`);
  const b=$("#modal [data-goStep1]");if(b)b.addEventListener("click",()=>{step=1;setView("debrief")});return}
 storeLocal(d,true);
 const html=standalone(`${d.teacher} – coaching conversation`,planSheet(d),d);
 const teacher=cleanName(d.teacher), link=spTeacherLink(d.teacher);
 const planName=convFilename(d).replace(/\.html$/,".docx"),cardName=cardFilename(d).replace(/\.html$/,".docx");
 const planDoc=DOCX.build(planSheet(d),`${d.teacher} – coaching conversation`,d),cardDoc=DOCX.build(actionCardSheet(d),`${d.teacher} – action card`);
 const FILES=[[planName,planDoc],[cardName,cardDoc]];
 const writeAll=async()=>{const r=await writeTo([teacher],planName,planDoc);const r2=await writeTo([teacher],cardName,cardDoc);r.renamed=r.renamed||r2.renamed;return r};
 const markSp=(how)=>{const s=saved.find(x=>x.id===d.id);if(s){s.spSaved=(how||"saved")+" "+new Date().toLocaleDateString();persist("saved")}};
 if(fsSupported()){
  await loadRoot();
  if(spRoot&&(await permitted(spRoot,false))){
   try{const r=await writeAll();markSp();toast(`${r.renamed?"<b>Saved as a new copy</b> – the earlier file was open or still syncing, so it wasn’t replaced<br>":`<b>${r.existed?"Saved (replaced the earlier copies)":"Saved to SharePoint"}</b>`} – full plan and action card (Word)<br><br>${r.path.map(esc).join(" › ")}${link?`<br><a href="${esc(link)}" target="_blank" rel="noopener">Open ${esc(teacher)}’s folder in SharePoint</a>`:""}`,9000);render();return}
   catch(e){/* fall through to dialog */}
  }
 }
 showModal(`<h2>Save to SharePoint</h2>
  <p>Saves the full plan and the teacher’s action card as Word documents in <b>${esc(teacher)}</b>’s folder. The full plan can also be reopened in Blueprint later.</p>
  ${[planName,cardName].map(f=>`<div class="path">${esc(spRoot?spRoot.name:"Coaching conversations")}<span>›</span>${esc(teacher)}<span>›</span><b>${esc(f)}</b></div>`).join("")}
  <div class="row">${fsSupported()?`<button class="btn hi" data-m="connectsave">${spRoot?"Save":"Connect synced folder and save"}</button>`:""}
  <button class="btn ${fsSupported()?"alt":"hi"}" data-m="download">Download both files</button>
  ${link?`<a class="btn alt" href="${esc(link)}" target="_blank" rel="noopener">Open ${esc(teacher)}’s SharePoint folder ↗</a>`:""}
  <button class="btn ghost" data-mclose>Cancel</button></div>
  <p class="small muted" style="margin-top:10px">${fsSupported()?"Choose the synced copy of your coaching folder (in File Explorer under your school’s name). A folder for the teacher is made if it doesn’t exist.":"Download the files, then drag them into the teacher’s folder. If the folder doesn’t exist yet, create it in SharePoint with the teacher’s name."}${link?"":` Add your SharePoint folder address in <a href="#" data-mgo="settings">Backup &amp; SharePoint</a> to get an Open folder link.`}</p>
  <p class="small" id="mErr" style="color:#b00020"></p>`);
 const mb=$("#modal");
 const on=(q,f)=>{const b=mb.querySelector(q);if(b)b.onclick=f};
 on('[data-m="download"]',async()=>{for(const [n,c] of FILES){await download(n,c,n.endsWith(".docx")?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":"text/html");await new Promise(r=>setTimeout(r,400))}markSp("file downloaded");hideModal();if(link)toast(`File downloaded. <a href="${esc(link)}" target="_blank" rel="noopener">Open ${esc(teacher)}’s folder</a> and drag them in.`,9000)});
 on('[data-m="connectsave"]',async()=>{try{if(!spRoot)await connectFolder();const r=await writeAll();markSp();hideModal();toast(`<b>Saved to SharePoint</b> – full plan and action card (Word)<br>${r.path.map(esc).join(" › ")}${link?`<br><a href="${esc(link)}" target="_blank" rel="noopener">Open ${esc(teacher)}’s folder</a>`:""}`,9000);render()}catch(e){if(e.name!=="AbortError")$("#mErr").textContent=e.message==="permission"?"The browser didn’t allow saving there. Try again and choose Allow, or download instead.":"Couldn’t save there ("+(e.message||e.name)+"). Download instead."}});

function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(f)})}
async function restore(file){
 let data;try{data=JSON.parse(await readFile(file))}catch(e){toast("That file isn’t a Blueprint backup.");return}
 if(!data||data.app!=="coaching-debrief-playbook"){toast("That file isn’t a Blueprint backup.");return}
 const c=k=>Object.keys(data[k]||{}).length;
 showModal(`<h2>Restore from backup</h2><p class="small muted">Backup from ${esc(new Date(data.exported).toLocaleString())}</p>
 <p>It contains <b>${(data.saved||[]).length}</b> conversations, <b>${c("custom")}</b> of your techniques, <b>${c("edits")}</b> edited techniques and <b>${c("videos")}</b> video links${(data.walks||[]).length?`, <b>${data.walks.length}</b> learning walk visits`:""}${(data.settings&&data.settings.playbook||[]).length?` and a school playbook of <b>${data.settings.playbook.length}</b> techniques`:""}.</p>
 <p class="small"><b>Merge</b> adds what’s in the file and keeps what’s here (the file wins where the same item exists). <b>Replace</b> makes this browser match the file exactly.</p>
 <div class="row"><button class="btn hi" data-m="merge">Merge</button><button class="btn alt" data-m="replace">Replace everything</button><button class="btn ghost" data-mclose>Cancel</button></div>`);
 const apply=mode=>{
  if(mode==="replace"){custom=data.custom||{};edits=data.edits||{};videos=data.videos||{};moments=data.moments||{};nuances=data.nuances||{};saved=data.saved||[];walks=data.walks||[];agreements=data.agreements||{};settings=Object.assign({spUrl:"",school:"",playbook:[],timerMins:20},data.settings||{})}
  else{custom=Object.assign({},custom,data.custom||{});edits=Object.assign({},edits,data.edits||{});videos=Object.assign({},videos,data.videos||{});moments=Object.assign({},moments,data.moments||{});nuances=Object.assign({},nuances,data.nuances||{});
   const ids=new Map(saved.map((s,i)=>[s.id,i]));(data.saved||[]).forEach(s=>{if(ids.has(s.id))saved[ids.get(s.id)]=s;else saved.push(s)});
   const wids=new Map(walks.map((v,i)=>[v.id,i]));(data.walks||[]).forEach(v=>{if(wids.has(v.id))walks[wids.get(v.id)]=v;else walks.push(v)});Object.assign(agreements,data.agreements||{});
   const ds=data.settings||{};if(ds.spUrl&&!settings.spUrl)settings.spUrl=ds.spUrl;if(ds.school&&!settings.school)settings.school=ds.school;if(ds.schoolLogo&&!settings.schoolLogo)settings.schoolLogo=ds.schoolLogo;if(ds.theme&&!settings.theme)settings.theme=ds.theme;settings.playbook=[...new Set((settings.playbook||[]).concat(ds.playbook||[]))]}
  ["custom","edits","videos","moments","saved","settings","nuance"].forEach(persist);LS.set("cdp_walks",walks);LS.set("cdp_agreements",agreements);LS.set(KEYS.backup,Date.now());rebuild();applyBranding();hideModal();render();toast("Backup restored.");
 };
 $("#modal [data-m=merge]").onclick=()=>apply("merge");$("#modal [data-m=replace]").onclick=()=>apply("replace");
}
