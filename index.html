ds."},"hinge":{"n":"Hinge question","m":"cfu","also":["explain","responsive"],"src":"VTLM 2.0 – Monitor progress (hinge questions); WalkThrus – hinge questions; Dylan Wiliam – hinge-point questions","p":"A quick, well-designed diagnostic question at the key point in the lesson that tells you whether to move on or re-teach.","w":"Well-designed wrong options reveal specific misconceptions, so you know exactly what to address.","steps":[["Find the hinge point","The moment where students must understand before moving on."],["Write a multiple-choice question","One correct answer and wrong answers based on common misconceptions."],["All students respond at once","Fingers, boards or cards – within 30 seconds."],["Read the response pattern","Who chose what tells you which misconception exists."],["Decide on the spot","Most right: move on. Split: re-teach. Few right: re-model differently."]],"look":["Distractors map to misconceptions","Whole-class response in under a minute","Clear decision made from the evidence"],"pit":["Distractors that are obviously wrong","Asking but not acting on results","Using open questions that take too long to read"],"say":"Write one hinge question for tomorrow. For each wrong option, write what misconception it reveals and your response."},"activeMon":{"n":"Active monitoring (track, don’t just watch)","m":"cfu","also":["supervision","responsive"],"src":"Teach Like a Champion – Active Observation; Responsive teaching (Sherrington & Ryrie Jones)","p":"During practice, circulate with a plan for what to look for, track errors and success, and use that to decide your next move.","w":"Monitoring with a clear focus turns circulating into evidence – you see patterns, not just individuals.","steps":[["Decide what you’re looking for","Before practice, name the key step or likely error."],["Plan a route","Start with students who often need support, then sample widely."],["Track as you go","Tick or note on a class list or clipboard: right / error type."],["Give quick feedback","Brief prompts or marks; avoid long conferences."],["Act on patterns","If several have the same error, stop the class and address it."]],"look":["Teacher has a clear focus for monitoring","Errors tracked, not just noticed","Whole-class pause when patterns emerge"],"pit":["Circulating without purpose","Long one-to-one help that leaves others","Noticing errors but not addressing them as a group"],"say":"Make a quick tracking sheet for the next lesson: names plus 2 columns (got it / error)."},"probe":{"n":"Probe the thinking","m":"cfu","also":["vary"],"src":"VTLM 2.0 – Vary practice (elaborative interrogation); Responsive teaching (Sherrington & Ryrie Jones); WalkThrus – probing questions","p":"Follow up answers – right or wrong – with questions that reveal how the student got there.","w":"A correct answer can hide a wrong method, and a wrong answer often contains useful thinking. Probing shows what students really understand.","steps":[["Accept the answer neutrally","Don’t signal right or wrong yet: ‘Okay…’"],["Ask how","‘How did you get that?’ ‘Talk me through it.’"],["Ask why","‘Why does that step work?’"],["Check with others","‘Who agrees/disagrees? Why?’"],["Clarify the key idea","Summarise the correct reasoning for everyone."]],"look":["Follow-up questions after answers","Neutral response before probing","Reasoning made visible to the class"],"pit":["Only probing wrong answers (students learn it means ‘wrong’)","Too many probes slowing the lesson","Answering for the student"],"say":"Plan three ‘how/why’ follow-ups for tomorrow’s key question."},"exitTicket":{"n":"Exit ticket","m":"cfu","also":["focus","responsive"],"src":"VTLM 2.0 – Monitor progress; Focus the learning (exit tickets); Teach Like a Champion – Exit Ticket; WalkThrus – exit tickets","p":"A short task at the end of the lesson that shows whether each student met the learning intention, used to plan the next lesson.","w":"It gives individual evidence from every student, so you can plan who needs what tomorrow.","steps":[["Match it to the success criteria","1–3 questions that show the key learning."],["Keep it quick","3–5 minutes, done independently."],["Sort the responses","Got it / nearly / not yet piles."],["Plan the next move","Start next lesson with a fix for common errors; group students as needed."],["Close the loop","Show students how their responses shaped the next lesson."]],"look":["Questions match the LI","Responses sorted the same day","Next lesson changes based on results"],"pit":["Asking students to rate their confidence instead","Collecting but never looking","Too long to analyse quickly"],"say":"Write the exit ticket for the next lesson and decide what each pile will get tomorrow."},"showCall":{"n":"Show call","m":"cfu","also":["vary"],"src":"Teach Like a Champion – Show Call","p":"Display a student’s work to the class (visualiser or photo) and analyse it together to build understanding and standards.","w":"Real student work makes success criteria concrete and normalises learning from errors.","steps":[["Choose work purposefully","A strong example, a common error, or work that’s nearly there."],["Set expectations","Make it normal: everyone’s work might be shown."],["Display it","Put it under the visualiser or project a photo."],["Analyse together","‘What has this writer done well? What would improve it?’"],["Apply it","Students revise their own work using what was discussed."]],"look":["Work chosen for a teaching purpose","Analysis is specific and kind","Students revise afterwards"],"pit":["Only showing perfect work","Shaming errors","No time to revise"],"say":"Agree the norms you’ll say when you first show call, and practise analysing one sample."},"respond":{"n":"Respond: reteach, re-model or move on","m":"responsive","also":["cfu"],"src":"VTLM 2.0 – Monitor progress (Use responsive teaching for all); Responsive teaching (Sherrington & Ryrie Jones); VTLM 2.0 – monitor progress","p":"Decide in advance what you will do with the evidence from a check – and when you reteach, do it differently.","w":"A check is only useful if it changes what happens next. Repeating the same explanation louder rarely helps.","steps":[["Set a threshold","Before checking, decide: e.g. 80%+ correct = move on."],["Check every student","Boards, hinge question or monitoring."],["Diagnose the error","What exactly went wrong – a step, a concept, vocabulary?"],["Choose a different response","New example, non-example, back up a step, or worked example – not the same explanation."],["Re-check","Ask a similar question to confirm the fix worked; pull a small group if needed."]],"look":["Thresholds planned","Reteach differs from first explanation","Re-check after reteaching"],"pit":["Moving on when most are wrong","Same explanation repeated","Reteaching without re-checking"],"say":"For tomorrow’s key check, write: threshold, likely error, and a different re-explanation."},"rightIsRight":{"n":"Right is right (hold the bar)","m":"cfu","also":["vary"],"src":"Teach Like a Champion – Right Is Right","p":"Only accept fully correct answers as correct – nearly right is acknowledged, and the student is pushed to complete it.","w":"Rounding up partial answers tells students they’re done when they’re not, and the misconception remains.","steps":[["Know the full answer","Plan exactly what a complete answer includes."],["Acknowledge what’s right","‘You’re right that… ’"],["Name what’s missing","‘…but what else do we need?’"],["Keep the student working","Prompt until they complete it, or bring in another student then return."],["Confirm the complete answer","State or have the class repeat the full correct answer."]],"look":["Partial answers not accepted as complete","Students complete their own answers","Precise vocabulary required"],"pit":["Finishing the answer for the student","Saying ‘yes’ to a nearly-right answer","Being harsh rather than encouraging"],"say":"List two nearly-right answers you heard today and script the follow-up."},"stretch":{"n":"Stretch it","m":"vary","src":"VTLM 2.0 – Monitor progress (Extend and challenge students); Teach Like a Champion – Stretch It","p":"Reward correct answers with harder follow-up questions that extend thinking.","w":"It keeps learning going for students who have it, and signals that right answers lead to more thinking, not the end.","steps":[["Acknowledge the correct answer","Brief and calm."],["Ask a ‘why’ or ‘how’","‘How do you know?’"],["Ask a ‘what if’","Change a condition: ‘What if it were negative?’"],["Ask for another way","‘Is there another method?’"],["Ask for transfer","‘Where else would this apply?’"]],"look":["Correct answers followed by harder questions","Range of students stretched","Questions build on the answer"],"pit":["Only stretching high achievers","Stretching so long others disengage","Questions unrelated to the learning"],"say":"For tomorrow’s key question, write 3 stretch follow-ups.","also":["responsive"]},"formatMatters":{"n":"Format matters (full, precise answers)","m":"vary","also":["otr"],"src":"Teach Like a Champion – Format Matters; WalkThrus – say it again, better","p":"Expect answers in complete sentences using precise subject vocabulary, so spoken answers rehearse academic language.","w":"How students say it shapes how they write and think. Full answers make reasoning visible.","steps":[["Set the expectation","Tell students: answers are full sentences with key words."],["Provide a stem","‘The answer is… because…’ when introducing it."],["Prompt briefly","‘Full sentence’ or ‘Use the word ___’."],["Ask again, better","‘Say that again using the word denominator.’"],["Acknowledge the upgrade","Recognise the improved answer."]],"look":["Full sentence answers common","Key vocabulary used","Quick prompts, not lectures"],"pit":["Enforcing for every answer and slowing pace","Accepting slang or vague terms","Stems never removed"],"say":"Choose 3 key words for the next lesson and plan stems that require them."},"normaliseError":{"n":"Normalise error (culture of error)","m":"inclusive","also":["cfu"],"src":"Teach Like a Champion – Culture of Error","p":"Make it safe and useful to share mistakes, so students reveal misconceptions instead of hiding them.","w":"You can only fix errors you can see. When mistakes are treated as information, students show their real thinking.","steps":[["Say why errors help","‘Mistakes show us what to work on.’"],["Respond neutrally","Thank students for sharing wrong answers; avoid sighs or quick fixes."],["Study errors as a class","‘Here’s a common mistake – what went wrong?’"],["Praise the fix","Recognise students who correct their own work."],["Model your own error","Make and correct a deliberate mistake."]],"look":["Students share wrong answers willingly","Errors analysed, not hidden","Calm, neutral teacher response"],"pit":["Over-praising wrong answers","Revealing who made the error unkindly","Moving on quickly after an error"],"say":"Plan a ‘favourite mistake’ moment for tomorrow and script how you’ll introduce it."},"quiz":{"n":"Low-stakes retrieval quiz","m":"review","also":["focus"],"src":"VTLM 2.0 – Revisit and review (low-stakes quizzes); WalkThrus – retrieval practice; Cognitive science – testing effect","p":"Short, frequent quizzes on previously learned content, done by everyone, marked quickly, no grades.","w":"Recalling information strengthens memory more than re-reading. Low stakes keep anxiety low and participation high.","steps":[["Choose spaced content","Mix recent and older content."],["Short and frequent","5 questions, a few times a week."],["Everyone answers","On paper or boards – no talking."],["Self or peer mark immediately","Give answers and quick explanations."],["Track and revisit","Note weak items and bring them back next time."]],"look":["All students recalling","Answers checked straight away","Weak items revisited"],"pit":["Making it high stakes","Only recent content","Not using results"],"say":"Build a 5-question quiz now for next week: 2 recent, 2 last month, 1 last term."},"prepTeach":{"n":"Lesson internalisation (Prepare to teach)","m":"prep","also":["explain","cfu"],"src":"VTLM 2.0 – Develop and deliver quality curriculum materials (Prepare to teach students in your classroom); Victorian Lesson Plans","p":"Before teaching, work through the lesson as a student would, then mark up exactly what you will say, show, ask and check.","w":"A lesson the teacher knows deeply is delivered more concisely, with fewer digressions and better-placed checks. Internalising common materials keeps their quality while fitting your class.","steps":[["Do the work yourself","Complete every task, example and question as a student. Note where it was tricky or where steps were hidden."],["Name the one big idea","Write the learning objective and success criteria in your own words. Cut anything that doesn’t serve them."],["Script the key moments","Write the exact wording for the explanation, the think-aloud and the key questions. Short is better."],["Mark the checks","Decide where you will check for understanding, how every student will respond, and what a correct answer looks like."],["Rehearse the hardest part","Say the trickiest explanation aloud (to a colleague or coach) and tighten it before the lesson."]],"look":["Teacher’s explanation matches the planned script and is concise","Checks happen at planned points with planned response methods","Teacher rarely refers to notes for the content itself"],"pit":["Reading the slides for the first time in front of the class","Planning activities but not the words and questions","Adding extra content that overloads the lesson"],"say":"Pick tomorrow’s lesson. Together, do the first task as students, then script the explanation and mark two CFU points."},"anticipateMis":{"n":"Anticipate misconceptions","m":"prep","also":["explain","scaffold"],"src":"VTLM 2.0 – Scaffold practice (Anticipate scaffolds to support learning); Explicit explanation (Use non-examples to address misconceptions)","p":"Plan in advance the errors students are most likely to make, how you will surface them and how you will respond.","w":"Errors you expect can be designed for – in examples, non-examples and hinge questions – instead of being discovered when marking.","steps":[["List the likely errors","Use past work, the VLP notes or your experience: what do students usually get wrong here?"],["Find the root","For each error, name the misunderstanding underneath it (not just the wrong answer)."],["Design a reveal","Write a question, non-example or hinge option that will expose each misconception."],["Plan the fix","Decide what you’ll do if it appears: a contrasting example, a concrete model or backing up a step."],["Plan the support","Prepare any scaffold you might need (e.g. a printed worked example, a number line) so it’s ready mid-lesson."]],"look":["Misconception questions planned into the lesson","Teacher responds to errors with a prepared alternative","Supports are on hand, not improvised"],"pit":["Listing errors but not planning the response","Only planning for the ‘average’ student","Treating every error as carelessness"],"say":"Name the top two misconceptions for the next lesson and write the question that would expose each one."},"exemplar":{"n":"Write the exemplar answer first","m":"prep","also":["cfu","focus"],"src":"VTLM 2.0 – Focus the learning (use exemplars against success criteria); Teach Like a Champion – exemplar planning","p":"Before the lesson, write the ideal answer to each key question and task, so you know exactly what you are looking for when you check.","w":"Without a clear target, ‘nearly right’ answers get accepted. A written exemplar sharpens questions, feedback and success criteria.","steps":[["Choose the key questions","Pick the 3–5 questions or tasks that best show the learning."],["Write the full answer","Write it as you want a student to say or write it – including vocabulary and reasoning."],["Mark the must-haves","Underline the parts that must be present for it to count as correct."],["Link to success criteria","Check each criterion is visible in the exemplar. Adjust either if they don’t match."],["Use it in the lesson","Hold the bar during questioning and use the exemplar (or part of it) as a model for students."]],"look":["Teacher can say exactly what a correct answer includes","Feedback names the missing must-have","Exemplar shown to students as a model"],"pit":["Exemplar too long or adult-level for the class","Writing it but not using it to judge answers","Only planning answers for easy questions"],"say":"Write the exemplar answer to tomorrow’s hinge or exit question together and underline the must-haves."},"planAdjust":{"n":"Plan adjustments (some students / specific students)","m":"prep","also":["inclusive","sequence"],"src":"VTLM 2.0 – Inclusive learning (Enable full participation); PCMS – Task difficulty; Develop and deliver quality curriculum materials (Determine class and student needs)","p":"Plan, before the lesson, the adjustments some students and specific students will need to access the same learning.","w":"Planned adjustments keep all students working on the core learning instead of being taken off-task or left behind.","steps":[["Start with the core","Name what every student must learn today."],["Check profiles and plans","Look at IEPs, student profiles and recent assessment for who needs what."],["Plan for some students","Choose adjustments likely to help a group: printed model, fewer items, vocabulary card, extra guided practice."],["Plan for specific students","Name individual adjustments: response mode, seating, breaks, materials, pre-teaching."],["Review after the lesson","Did the adjustment help them reach the core? Keep, change or fade it."]],"look":["Adjustments written on the plan before the lesson","Students with adjustments work on the same core learning","Adjustments reviewed and faded when no longer needed"],"pit":["Giving easier, different work instead of access to the same learning","Adjustments improvised mid-lesson","Never removing an adjustment"],"say":"For the next lesson, write one ‘some students’ and one ‘specific student’ adjustment and how you’ll know it worked."},"threshold":{"n":"Meet and greet at the door","m":"inclusive","also":["routines","selfreg"],"src":"VTLM 2.0 – Inclusive learning (Build trusting and respectful relationships); Teach Like a Champion – Threshold","p":"Greet each student by name at the door, set the tone for learning and point them to the first task.","w":"A brief, warm, predictable greeting builds relationships, lets you read how students are arriving and starts the routine on time.","steps":[["Be at the door","Stand where you can see both the corridor and the room."],["Greet each student by name","Eye contact, a smile, a short personal word – brief and warm."],["Read the room","Notice anyone who seems upset or unsettled and plan a quiet check-in."],["Set the expectation","Point to the first task: ‘Do Now is on the board.’"],["Fix small things early","Quietly address uniform, materials or attitude at the door before they come into the lesson."]],"look":["Every student greeted by name","Students move straight to the first task","Teacher notices and follows up students who arrive unsettled"],"pit":["Greeting only some students","Long conversations that delay the start","Using the door for public reprimands"],"say":"Practise the greeting and the one-line pointer to the first task; coach plays an unsettled student."},"highExpect":{"n":"High expectations language (‘not yet’)","m":"inclusive","also":["selfreg","behaviour"],"src":"VTLM 2.0 – Inclusive learning (Maintain high expectations); Enable student self-regulation and self-efficacy","p":"Use language and actions that show every student you believe they can succeed – and keep the bar high while giving the support to reach it.","w":"Students rise to (or fall to) the expectations they sense. Pairing high expectations with support builds effort and self-efficacy.","steps":[["Check your own expectations","Notice who you ask the hard questions to and who you rescue quickly. Look for bias."],["Say you believe they can","‘This is tricky and I know you can do it.’"],["Use ‘not yet’","Frame incomplete work as ‘not yet’ and name the next step."],["Give support, not a lower bar","Offer a prompt, model or scaffold – keep the same goal."],["Recognise effort and progress","Specifically praise the strategy and persistence, not just the answer."]],"look":["All students get challenging questions","Teacher responds to struggle with support, not lower demands","Students use ‘not yet’ language themselves"],"pit":["Accepting less from some students","Praising ability (‘you’re so smart’)","Rescuing too quickly"],"say":"List three phrases you’ll use when a student is struggling. Rehearse them with the coach as the student."},"studentVoice":{"n":"Student voice check-ins","m":"inclusive","also":["selfreg"],"src":"VTLM 2.0 – Inclusive learning (Invite student voice through exit tickets, class surveys or suggestion boxes)","p":"Regularly and briefly ask students how learning is going for them, then show them what you changed as a result.","w":"Asking – and acting – builds trust and gives you information about barriers you can’t see from the front.","steps":[["Pick one question","E.g. ‘What helped you learn today?’ or ‘What should I explain again?’"],["Make it quick and private","Add it to an exit ticket or a short form; allow anonymity if needed."],["Look for patterns","Sort responses: what’s common, who needs a follow-up."],["Close the loop","Tell the class what you heard and what you will change."],["Follow up individuals","Check in privately with anyone who raised a concern."]],"look":["Student voice collected regularly","Teacher shares what changed because of it","Individual concerns followed up"],"pit":["Asking but never acting","Questions too broad (‘Did you like it?’)","Using it instead of checking learning"],"say":"Draft one student-voice question to add to an exit ticket this week and how you will report back."},"partnerships":{"n":"Intentional partners and groupings","m":"inclusive","also":["otr","apply"],"src":"VTLM 2.0 – Inclusive learning (Facilitate positive interactions among students); Monitor progress (flexible groups)","p":"Plan who works with whom, teach how partners work together, and rotate partnerships so all students build positive working relationships.","w":"Random or self-chosen groupings can exclude students and waste time. Planned partnerships make talk productive and inclusive.","steps":[["Plan the pairs","Use what you know: pair for support, for similar readiness or for social reasons."],["Make it visible","Display a seating or partner chart so there is no negotiation."],["Teach partner behaviours","Model what a good partner does: face, listen, take turns, help without telling."],["Practise and give feedback","Narrate good partner behaviour and re-teach quickly when needed."],["Rotate deliberately","Change partners regularly so all students work with a range of peers."]],"look":["No time lost choosing partners","Students treat partners respectfully","Partnerships changed on purpose, not by chance"],"pit":["Always pairing the strongest with the weakest","Letting friends choose every time","Never teaching what good partnering looks like"],"say":"Draft partner pairs for the class and script the 30-second model of a good partner."},"teachExpect":{"n":"Teach the expectations (rules in action)","m":"routines","also":["behaviour"],"src":"PCMS – Classroom rules and expectations; Classroom procedures and routines","p":"Explicitly teach what the school’s expectations look like and sound like in each classroom routine – then revisit them often.","w":"Students can’t meet expectations they haven’t been taught. Concrete examples make abstract rules (‘be respectful’) usable.","steps":[["Use the school’s expectations","Start from the whole-school expectations or matrix."],["Make them concrete","For each routine (e.g. mat time, independent work), list what it looks like and sounds like."],["Teach with examples and non-examples","Model the right way and a wrong way; ask students to spot the difference."],["Display and refer","Put them where students can see them and point to them before routines."],["Re-teach after breaks","Revisit at the start of terms, after holidays and when things slip."]],"look":["Students can describe what the expectation looks like","Visuals displayed and referred to","Re-teaching happens before problems, not only after"],"pit":["Posters with no teaching","Rules that are vague or too many","Teaching once at the start of the year only"],"say":"Choose one routine. Write three ‘looks like / sounds like’ points and rehearse teaching it with a non-example."},"positioning":{"n":"Strategic positioning (see every student)","m":"supervision","also":["responsive","routines"],"src":"PCMS – Active supervision (position yourself to see all students in every group setting)","p":"Arrange the room and choose where you stand, sit or kneel so you can see every student – including when you’re working with a small group or one student.","w":"You can only supervise what you can see. Good positioning prevents problems and lets you notice who needs help.","steps":[["Check the sightlines","Stand in your usual teaching spots and check you can see every face and every desk."],["Set up the room","Arrange furniture so you can move to every student quickly; remove blind spots."],["Face the room when helping","Kneel or sit so your back is to the wall and you can see most of the class."],["Seat the small group facing you","Place your teaching table where you look out at the rest of the class."],["Look up regularly","Every 20–30 seconds, lift your eyes and scan, even mid-conversation."]],"look":["Teacher can see all students from wherever they work","Small-group table faces the room","Teacher looks up regularly while helping"],"pit":["Teacher table in a corner facing the wall","Kneeling with back to the class","Room layout that blocks movement"],"say":"Sketch the room layout and mark your teaching spots and small-group table so you face the class from each."},"proximity":{"n":"Proximity and non-verbal cues","m":"supervision","also":["behaviour"],"src":"PCMS – Discouraging inappropriate behaviour (indirect responses: proximity, signals and cues); Active supervision (interact non-verbally)","p":"Use your presence and silent signals – moving closer, eye contact, a gesture – to redirect students without stopping the lesson.","w":"Non-verbal cues correct behaviour privately and keep the pace of the lesson, so the rest of the class keeps learning.","steps":[["Agree a few signals","Teach simple gestures: eyes on me, voices off, pen moving, thumbs up."],["Move towards, keep teaching","Walk towards the off-task student while continuing to explain."],["Make eye contact","Pause briefly and hold eye contact; add the signal if needed."],["Acknowledge the fix","A nod or thumbs up when they get back on track."],["Escalate only if needed","If it doesn’t work, move to a quiet private word."]],"look":["Teaching continues while redirecting","Students respond to signals quickly","Most redirections are silent"],"pit":["Stopping the lesson to correct","Signals students haven’t been taught","Standing over students in a threatening way"],"say":"Rehearse explaining a concept while moving to a ‘student’ and using a signal without breaking your sentence."},"reteachBehav":{"n":"Prompt, redirect, re-teach","m":"behaviour","also":["routines"],"src":"PCMS – Discouraging inappropriate behaviour (direct responses: prompt, redirect, re-teach)","p":"When an indirect response hasn’t worked, respond directly and calmly: prompt the expectation, redirect to the task, and re-teach the routine if needed.","w":"Treating behaviour errors like learning errors – teach, practise, feedback – is more effective than escalating consequences.","steps":[["Prompt","Briefly remind the student of the expectation: ‘Remember, voices off during independent work.’"],["Redirect","Point them to what to do now: ‘Start question 2.’"],["Re-teach privately","If it continues, re-teach the routine quickly, away from the audience."],["Acknowledge the fix","Notice when they get back on track and say so."],["Follow school processes","If needed, use the school’s predictable consequence calmly and without debate."]],"look":["Calm, brief, private direct responses","Student back on task quickly","Positive acknowledgement after correction"],"pit":["Lecturing in front of the class","Skipping straight to consequences","Inconsistent responses between students"],"say":"Coach plays a student who keeps talking. Practise prompt → redirect → private re-teach in under 30 seconds."},"behMomentum":{"n":"Easy-to-hard sequencing (behavioural momentum)","m":"sequence","also":["selfreg"],"src":"PCMS – Activity sequence and choice (sequence tasks strategically)","p":"Start with a few quick, achievable tasks before harder ones, and alternate demanding work with brief, easier activity.","w":"Early success builds momentum and confidence, making students more likely to engage with the harder task that follows.","steps":[["Look at the task order","Where does the hardest part of the lesson sit? Is the start too hard or too slow?"],["Open with quick wins","Begin with 2–3 brief items most students will get right."],["Then step up","Introduce the harder task while momentum is high."],["Break up long demands","Alternate long or difficult tasks with short, easier ones or a movement break."],["Acknowledge success","Narrate the early successes to build confidence."]],"look":["Most students succeed in the first minutes","Harder tasks follow early success","Long demands are broken up"],"pit":["Opening with the hardest task","Easy tasks that waste time","Never reaching the challenging work"],"say":"Re-order tomorrow’s independent task: write the three quick wins that will open it."},"choiceMenu":{"n":"Choice menu","m":"sequence","also":["selfreg","inclusive"],"src":"PCMS – Activity sequence and choice (plan a menu of acceptable choices)","p":"Offer a limited menu of acceptable choices – how to respond, which tool, which partner, which order, where to work – within the same learning.","w":"Structured choice increases engagement and a sense of control, without changing the learning goal.","steps":[["Keep the learning fixed","Decide what every student must do and learn."],["Pick what can vary","Choose 1–2 things: order of tasks, response method, tool, partner or location."],["Offer 2–3 options","Too many choices slow students down."],["Teach the choices","Show what each option looks like and the expectations for each."],["Review","Check that choices led to learning; adjust the menu."]],"look":["All choices lead to the same learning","Students choose quickly","Engagement increases for students who struggled"],"pit":["Choices that become easier work","Too many options","Choosing taking longer than the task"],"say":"Write a 3-option choice menu for one task next week. Check each option still meets the success criteria."},"taskAdjust":{"n":"Adjust task difficulty","m":"sequence","also":["scaffold","inclusive"],"src":"PCMS – Task difficulty (shorter tasks, more time, breaks, varied input and response, extra support or extension)","p":"Match the task to students’ current readiness so they can succeed with effort – adjusting length, time, input, response or support.","w":"Tasks that are too hard lead to avoidance; too easy leads to boredom. The right challenge keeps students working and learning.","steps":[["Check the evidence","Use the last check for understanding to see who is ready for what."],["Adjust the amount, not the goal","Fewer items, chunked into sections, or more time."],["Adjust input or response","Read aloud, visuals, concrete materials; oral, typed or drawn responses."],["Build in breaks or check points","Short pauses or teacher check-ins between chunks."],["Plan the extension","Have harder items ready for students who are ready."]],"look":["Students working with effort and success","Adjustments match evidence, not assumptions","Extension available and used"],"pit":["Giving different, lower-level content","Same task for all regardless of evidence","Extension as ‘more of the same’"],"say":"Take one task and write three versions: chunked, standard and extended – all meeting the same criteria."},"regulation":{"n":"Teach a regulation routine","m":"selfreg","also":["behaviour","inclusive"],"src":"VTLM 2.0 – Enable student self-regulation and self-efficacy (Teach strategies for emotional regulation); Resilience, Rights and Respectful Relationships","p":"Explicitly teach students a simple routine to notice and name their feelings and choose a strategy to get back to learning.","w":"Students who can recognise and manage their emotions are more ready to learn. Teaching it explicitly helps all students, not just those who struggle.","steps":[["Teach the words","Give students language to name feelings and how strong they are."],["Teach two or three strategies","E.g. slow breathing, a short movement, a quiet reset spot – model each."],["Practise when calm","Rehearse the routine when students are settled, not only in the moment."],["Prompt calmly in the moment","Point students to their strategy quietly: ‘Which strategy will help now?’"],["Plan for individuals","For students who need more, build a plan with them, families and the support team."]],"look":["Students can name a strategy they use","Teacher prompts strategies calmly","Students return to learning faster after dysregulation"],"pit":["Only teaching it during a crisis","Strategies that remove students from learning for long periods","Responding to escalation with escalation"],"say":"Choose the class strategies and script how you will introduce and model one tomorrow."},"pme":{"n":"Plan – Monitor – Evaluate","m":"selfreg","also":["apply"],"src":"VTLM 2.0 – Enable student self-regulation (Teach the planning, monitoring and evaluation cycle); Apply learning and build mastery (Teach metacognitive strategies)","p":"Teach students to plan how they’ll tackle a task, monitor how it’s going, and evaluate what worked – using question prompts at each stage.","w":"Metacognitive strategies help students take control of their learning, especially on longer or more complex tasks.","steps":[["Model the cycle aloud","On a task, think aloud: ‘My goal is… My plan is… How’s it going?… What worked?’"],["Give prompt questions","Plan: What do I need to do? What do I know that helps? Monitor: Is this working? Evaluate: What would I do differently?"],["Use it during guided practice","Pause students at each stage to answer the prompts."],["Fade your prompts","Move from teacher prompting to students using a prompt card independently."],["Reflect at the end","Have students write one evaluation sentence linked to the success criteria."]],"look":["Students plan before starting","Students check their work mid-task","Reflections refer to strategies, not just feelings"],"pit":["Using it for every tiny task","Generic reflection (‘I did good’)","Never modelling it"],"say":"Write the plan/monitor/evaluate prompts for a task next week and script your think-aloud model."},"selfQuestion":{"n":"Self-questioning prompts","m":"selfreg","also":["explain","apply"],"src":"VTLM 2.0 – Explicit explanation (prompt self-questioning); Enable student self-regulation (Model self-questioning)","p":"Model and prompt the questions an expert asks themself during a task, until students ask them on their own.","w":"Self-questioning makes the hidden steps of thinking visible and transferable, and helps students get unstuck independently.","steps":[["Choose 3–4 questions","E.g. ‘What is this asking?’ ‘What have I done before that’s similar?’ ‘What’s my next step?’ ‘Does my answer make sense?’"],["Model them aloud","Use them in your think-aloud during the worked example."],["Prompt students to use them","‘Ask yourself question 2’ instead of telling the answer."],["Display them","Keep them on a card or on the board during practice."],["Fade","Remove the display once students use them without prompting."]],"look":["Teacher models questions during examples","Students use the questions when stuck","Fewer ‘I’m stuck’ requests"],"pit":["Too many questions","Questions displayed but never modelled","Answering for students instead of prompting"],"say":"Pick the 3 self-questions for your subject and rehearse using them in a think-aloud."},"trackSC":{"n":"Students track progress against success criteria","m":"selfreg","also":["focus","cfu"],"src":"VTLM 2.0 – Enable student self-regulation (refer to LOs and SC so students track progress); Focus the learning (Review achievement of LOs and SC)","p":"Students regularly check their own work against the success criteria and decide their next step.","w":"When students can judge their own progress, they become more independent and feedback becomes more useful.","steps":[["Make criteria checkable","Write success criteria as clear ‘I can’ steps students can see in their work."],["Model self-checking","Check an example against the criteria aloud."],["Build in check points","Mid-task: ‘Tick the criteria you’ve met so far.’"],["Check their judgement","Spot-check a few self-assessments against the work."],["Act on it","Students pick a next step for the criteria they haven’t met."]],"look":["Students refer to criteria while working","Self-assessments match the work","Students set specific next steps"],"pit":["Smiley-face confidence ratings","Criteria too vague to check","No time to act on the self-check"],"say":"Rewrite one set of success criteria as a tick-box checklist and plan the mid-task check point."},"cultureConnect":{"n":"Connect learning to students’ cultures and experiences","m":"culture","also":["focus","inclusive"],"src":"VTLM 2.0 – Cultural responsiveness (Incorporate cultural diversity in the learning program; Strengthen belonging and connectedness)","p":"Plan examples, texts and contexts that reflect the cultures and experiences of students in the class, including local Aboriginal and Torres Strait Islander perspectives.","w":"Students learn more when they see themselves and their communities in what they learn, and it builds belonging.","steps":[["Know your students","Use what students and families have shared about their cultures, languages and experiences."],["Audit the examples","Look at who is represented in the texts, names, images and contexts in the unit."],["Plan inclusive examples","Swap in examples and authors that reflect diverse cultures, prioritising local Koorie perspectives where relevant."],["Invite sharing safely","Let students share if they want to, without making them the expert for their culture."],["Check protocols","Learn cultural protocols from respected sources (e.g. the Koorie Education Workforce) before teaching sensitive content."]],"look":["Diverse cultures visible in examples and texts","Students choose whether to share","Protocols followed for culturally sensitive content"],"pit":["Token or one-off inclusion","Putting a student on the spot to represent their culture","Using content without checking protocols"],"say":"Audit one upcoming lesson’s examples together and swap in two that better reflect the class."},"respectNorms":{"n":"Respectful language norms","m":"culture","also":["inclusive","behaviour"],"src":"VTLM 2.0 – Cultural responsiveness (Set clear expectations for respectful language; respond to racism); Inclusive learning (Model respect and challenge discrimination)","p":"Set, teach and uphold clear norms for respectful language, and respond immediately and consistently to discriminatory comments.","w":"Students need to feel safe to participate. Clear norms and consistent responses protect cultural safety and belonging.","steps":[["Set the norms with students","Agree what respectful language looks and sounds like in discussion."],["Model it","Use inclusive language and show how to disagree respectfully."],["Respond straight away","Name discriminatory comments calmly and clearly; don’t let them pass."],["Follow school policy","Use the school’s steps for addressing racism and discrimination, including follow-up."],["Repair and reinforce","Support the affected student, and revisit norms with the class when needed."]],"look":["Norms displayed and referred to","Comments addressed immediately","Students challenge disrespect themselves"],"pit":["Ignoring ‘jokes’","Responding inconsistently","Handling it publicly in a way that harms the targeted student"],"say":"Script your immediate response to a discriminatory comment and rehearse it calmly."},"advanceOrg":{"n":"Advance organiser","m":"focus","also":["explain"],"src":"VTLM 2.0 – Focus the learning (Use advance organisers); WalkThrus – advance organisers","p":"Show students at the start how the new learning fits with what they already know – a simple map or overview you return to throughout the unit.","w":"Seeing the structure helps students organise new information and connect it to prior knowledge, which supports memory.","steps":[["Map the big ideas","Draw a simple diagram, timeline or flow of the unit’s key ideas and how they link."],["Show the link to prior learning","Mark what students already know and where today’s learning fits."],["Present it at the start","Walk through it briefly at the beginning of the lesson or sequence."],["Return to it","Refer back each time a new idea is introduced: ‘Today we’re here.’"],["Have students use it","Students add to it, explain links or rebuild it from memory."]],"look":["Organiser visible and referred to","Students can say where today fits","Links between ideas explained, not just listed"],"pit":["Overloaded, text-heavy organisers","Showing it once and never again","Too abstract to connect to prior learning"],"say":"Sketch the advance organiser for the current unit on one page and plan how you’ll introduce it in 2 minutes."},"hook":{"n":"Everyday connection","m":"focus","also":["explain"],"src":"VTLM 2.0 – Focus the learning (Start new concepts with everyday experiences)","p":"Introduce a new concept through a familiar, concrete experience before moving to the formal idea.","w":"Concrete, familiar starting points give students something to hang the new idea on, improving engagement and retention.","steps":[["Find the familiar","Choose an everyday experience that genuinely shows the concept (e.g. sharing a pizza for fractions)."],["Keep it short","1–2 minutes; it’s a bridge, not the lesson."],["Name the concept","Explicitly connect: ‘This is what we call…’"],["Move to the formal","Shift to the precise definition, notation or example."],["Check the link","Ask students to explain how the example shows the concept."]],"look":["Clear link from experience to concept","Hook is brief","Students can explain the connection"],"pit":["Entertaining hooks that don’t show the concept","Spending too long on the hook","Never moving to the formal idea"],"say":"Brainstorm two everyday connections for the next concept and pick the one that best shows it."},"vocab":{"n":"Pre-teach key vocabulary","m":"focus","also":["explain","scaffold"],"src":"VTLM 2.0 – Explicit explanation (Preview and explain key vocabulary); Focus the learning (define key vocabulary)","p":"Explicitly teach the 2–4 key words students need before the main explanation, with a student-friendly definition and examples.","w":"Unknown words consume working memory during explanations. Teaching them first frees attention for the concept.","steps":[["Choose the words","Select the few terms students need to understand today’s learning."],["Say it, they say it","Model pronunciation; class repeats (choral)."],["Give a clear definition","Student-friendly, with an example and a non-example."],["Use it straight away","Ask students to use the word in a sentence or identify it."],["Keep it visible","Display the h approach to use.","w":"Mixing related problems teaches students to discriminate between them – a key part of real mastery.","steps":[["Check basic proficiency first","Interleave only after students can do each type on its own."],["Choose related types","E.g. mixed operations, or different text types with similar features."],["Mix the set","Alternate problem types rather than blocking them."],["Ask ‘how do you know which?’","Students explain how they chose the method."],["Increase similarity","Mix more similar types as students improve."]],"look":["Mixed practice after blocked practice","Students explain their choice of strategy","Challenge increases over time"],"pit":["Interleaving before students can do each type","Mixing unrelated content","Not discussing how to choose"],"say":"Rewrite one practice set so it mixes two related problem types and add a ‘which method?’ question."},"varyRep":{"n":"Vary representations and contexts","m":"vary","also":["apply","scaffold"],"src":"VTLM 2.0 – Vary practice (apply knowledge several ways and in different contexts; vary how students show learning; familiar to unfamiliar)","p":"Have students apply the same knowledge in different ways – different representations, contexts, materials and ways of showing it.","w":"Knowledge practised in only one form stays tied to it. Varied practice helps students transfer learning to new situations.","steps":[["Pick the core idea","What should students be able to apply?"],["Plan 2–3 representations","E.g. counters, drawing and equation; a summary, a concept map and an oral explanation."],["Move from familiar to unfamiliar","Start close to the taught example, then shift context."],["Connect the forms","Ask students how the representations show the same thing."],["Vary how students show it","Rotate response forms across lessons."]],"look":["Same idea practised in several forms","Context shifts from familiar to unfamiliar","Students connect representations"],"pit":["Variety for its own sake","Jumping to unfamiliar too early","Each form taught in isolation"],"say":"For one concept, plan three ways students will practise it across the week, from familiar to unfamiliar."},"brainDump":{"n":"Free recall (brain dump)","m":"review","also":["focus","selfreg"],"src":"VTLM 2.0 – Revisit and review (desirable-difficulty retrieval such as summarising from memory); WalkThrus – retrieval practice","p":"Students write everything they can remember about a topic from memory, then check and fill gaps from their notes.","w":"Effortful recall without prompts strengthens memory and shows students (and you) what they don’t yet know.","steps":[["Name the topic","Make it specific: ‘Everything you remember about the water cycle.’"],["Books closed, set a time","2–3 minutes, silent, from memory."],["Check and add in a different colour","Students use notes or a model to fill gaps."],["Share and correct","Pairs compare; teacher highlights key missed ideas."],["Use the gaps","Plan to revisit what most students missed."]],"look":["All students writing from memory","Gaps filled in a different colour","Teacher acts on common gaps"],"pit":["Allowing notes during recall","Topics too broad","Not checking against the correct content"],"say":"Pick a topic from 3 weeks ago and plan a brain dump with a model answer to check against."},"agreeDisagree":{"n":"Agree / disagree statements","m":"review","also":["otr","cfu"],"src":"VTLM 2.0 – Revisit and review (Promote high response and thinking rates: agree/disagree statements)","p":"Present a statement about prior learning; every student decides agree or disagree and is ready to justify their choice.","w":"A quick commitment from every student, followed by justification, combines high participation with thinking.","steps":[["Write strong statements","Include common misconceptions and nearly-true statements."],["Everyone commits","Show agree/disagree with signals or boards at the same time."],["Scan the split","Note how many agree and disagree."],["Co ks. Teaching effective strategies helps them learn independently and prepare for assessment.","steps":[["Explain why","Briefly show that testing yourself beats re-reading."],["Model making cards or questions","Question on one side, answer on the other – short and specific."],["Model the routine","Look, recall, check; put missed cards back in the pile."],["Practise in class","Students self-test for a few minutes with feedback."],["Plan the spacing","Show a simple revision timetable spread across days."]],"look":["Students make good self-test questions","Students self-test, not re-read","Revision spread over time"],"pit":["Cards with whole paragraphs","Telling but not modelling","Only before a test"],"say":"Make three model flash cards for the current unit and rehearse teaching the look–recall–check routine."},"modelProblem":{"n":"Model problem solving (Understand – Plan – Solve – Check)","m":"apply","also":["explain","selfreg"],"src":"VTLM 2.0 – Apply learning and build mastery (Model problem solving: where to start, spot and correct mistakes, Understand, Plan, Solve and Check)","p":"Explicitly model a problem-solving process – showing where to start, how to choose a strategy and how to check and fix mistakes.","w":"Novices often don’t know where to start. A modelled process gives them a way in and builds independence on unfamiliar problems.","steps":[["Understand","Read the problem aloud; underline what’s asked and what’s known; restate it."],["Plan","Think aloud about which strategy fits and why."],["Solve","Work it through, narrating decisions."],["Check","Does the answer make sense? Model finding and fixing a mistake."],["Hand over","Students use the same four steps with a prompt card, then without."]],"look":["Teacher models all four steps, including checking","Students use the process language","Students attempt unfamiliar problems"],"pit":["Modelling only the solving","Problems too hard before knowledge is secure","Prompt card never faded"],"say":"Choose a problem for next week and script the think-aloud for each of the four steps."},"openTask":{"n":"Open tasks with varied conditions","m":"apply","also":["vary","responsive"],"src":"VTLM 2.0 – Apply learning and build mastery (Use open tasks: multiple methods and solutions, Fermi problems, vary restrictions and conditions, real-world problems)","p":"Once knowledge is secure, set tasks with more than one method or answer, and vary the conditions to deepen thinking.","w":"Open tasks ask students to select and combine what they know, which builds flexible, transferable understanding.","steps":[["Check foundations","Use open tasks after students have the knowledge they need."],["Choose the task","A problem with multiple methods or answers, or a real-world question."],["Model an approach","Show one way to start without giving away the solution."],["Vary the conditions","Add a constraint or change a value: ‘Now there’s a 10% discount.’"],["Compare methods","Students share and compare approaches; discuss efficiency."]],"look":["Students have the knowledge to access the task","Multiple methods shared and compared","Conditions varied to deepen thinking"],"pit":["Open tasks before knowledge is taught","No modelling of how to start","No discussion of methods"],"say":"Adapt one closed question from the current unit into an open task, and write two ‘change the condition’ prompts."},"groupWork":{"n":"Structured group work","m":"apply","also":["inclusive","otr"],"src":"VTLM 2.0 – Apply learning and build mastery (Use group work: teach protocols, tools to structure discussion, tasks too hard for one person)","p":"Use group work only when the task needs it, and structure it with roles, protocols and tools so everyone contributes.","w":"Unstructured group work often leaves a few students doing everything. Structure makes it productive and inclusive.","steps":[["Check it’s worth it","Is the task too big or complex for one person? If not, use pairs or individual work."],["Assign roles","E.g.    OBSERVATION FOCUS + goal matching
   ===================================================================== */
const STOP=new Set("a an the to of and or in on for with be is are was were it its this that their them they we our my i you your more less get getting do does did can will would should not no too very so as at by from into about than then when what who how why all every each some most much many".split(" "));
const SYN={kid:"student",kids:"student",child:"student",children:"student",pupil:"student",learner:"student",
 answer:"respond",answering:"respond",reply:"respond",engaged:"engage",engagement:"engage",
 talk:"talk",talking:"talk",chat:"talk",discussion:"talk",behavior:"behaviour",misbehaviour:"behaviour",settle:"settled",calm:"settled",
 question:"question",questioning:"question",check:"check",checking:"check",understanding:"understand",understand:"understand",
 feedback:"feedback",mistake:"error",mistakes:"error",errors:"error",wrong:"error",explain:"explanation",explaining:"explanation",model:"model",modelling:"model",modeling:"model",
 transition:"transition",transitions:"transition",routine:"routine",routines:"routine",instruction:"direction",instructions:"direction",directions:"direction",
 review:"review",remember:"recall",forget:"recall",retrieval:"recall",memory:"recall",vocab:"vocabulary",words:"vocabulary",
 stuck:"stuck",help:"help",independent:"independent",independence:"independent",group:"group",groups:"group",pair:"partner",pairs:"partner",
 challenge:"extend",extension:"extend",stretch:"extend",harder:"extend",hard:"difficulty",easy:"difficulty",task:"task",tasks:"task"};
function toks(s){return String(s||"").toLowerCase().replace(/[’']/g,"").split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w)).map(w=>SYN[w]||w).map(w=>w.length>4?w.replace(/(ing|ed|es|s)$/,""):w)}
const normT=x=>(x||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
function techNames(id){const t=T[id];if(!t)return[];const n=t.n,parts=[n].concat(n.split(/[()\/–—:]/));return [...new Set(parts.map(normT).filter(x=>x.length>=4))]}
function matchTechs(text){const q=normT(text);if(q.length<3)return[];const out=[];
 Object.keys(T).forEach(id=>{const ns=techNames(id);let sc=0;
  ns.forEach(n=>{if((" "+q+" ").includes(" "+n+" "))sc=Math.max(sc,n.length+10);else if(q.length>=4&&n.includes(q))sc=Math.max(sc,q.length)});
  if(sc)out.push({id,sc})});
 return out.sort((a,b)=>b.sc-a.sc).map(x=>x.id)}
function goalsForTech(id){const r=[];MACROS.forEach(m=>m.probs.forEach(p=>{const i=(p.techs||[]).indexOf(id);if(i>=0)r.push({pid:p.id,macro:m.id,rank:i,tech:id})}));return r.sort((a,b)=>a.rank-b.rank)}
function matchGoals(text,limit,onlyMacro){
 const tm=matchTechs(text).slice(0,2),viaT={};tm.forEach((id,k)=>goalsForTech(id).forEach(g=>{const v=(k?6:10)-g.rank*2;if(!viaT[g.pid]||viaT[g.pid].v<v)viaT[g.pid]={v,tech:id}}));
 const q=[...new Set(toks(text))];if(!q.length)return [];
 const res=[];
 MACROS.forEach(m=>{if(onlyMacro&&m.id!==onlyMacro)return;const mt=new Set(toks(m.n+" "+m.d));m.probs.forEach(p=>{
  const gt=new Set(toks(GOALS[p.id])),pt=new Set(toks(p.t+" "+p.ask));let sc=0;
  q.forEach(w=>{if(gt.has(w))sc+=3;else if(pt.has(w))sc+=2;else if(mt.has(w))sc+=1;else{for(const x of gt){if(x.length>3&&(x.startsWith(w)||w.startsWith(x))){sc+=1;break}}}});
  const vt=viaT[p.id];if(vt)sc+=vt.v;
  if(sc>0)res.push({pid:p.id,macro:m.id,score:sc,tech:vt?vt.tech:null})})});
 return res.sort((a,b)=>b.score-a.score).slice(0,limit||3);
}
function matchMacros(text){const q=[...new Set(toks(text))];if(!q.length)return [];
 return MACROS.map(m=>{const nt=new Set(toks(m.n)),t=new Set(toks(m.d+" "+m.v));let sc=0;q.forEach(w=>{if(nt.has(w))sc+=4;else if(t.has(w))sc+=1;else for(const x of nt){if(x.length>3&&(x.startsWith(w)||w.startsWith(x))){sc+=2;break}}});return {m,sc}}).filter(x=>x.sc>1).sort((a,b)=>b.sc-a.sc).map(x=>x.m)}

function focusLookfors(){

}

  const bar=$("#dtimer");if(bar){bar.classList.toggle("over",left<0);let acc=0;const e=dtElapsed();bar.querySelectorAll(".ph").forEach((el,i)=>{const a=acc;acc+=PHASES[i][1]*total;el.classList.toggle("done",e>=acc);el.classList.toggle("on",e>=a&&e<acc)})}}

function norm(d){
 d=Object.assign(blank(),d||{});
 if(!Array.isArray(d.notice))d.notice=[];
 if(!d.notice.length&&d.strengths&&String(d.strengths).trim())d.notice=[{did:String(d.strengths).trim(),effect:""}];
 d.reflect=d.reflect||{};const pre=d.pre||{};
 if(!d.reflect.well)d.reflect.well=pre.well||"";
 if(!d.reflect.work)d.reflect.work=pre.feedback||pre.change||"";
 if(!Array.isArray(d.goals))d.goals=[];
 if(!Array.isArray(d.obsFocus))d.obsFocus=[];
 if(!d.goals.length&&d.probs&&d.probs.length&&d.chosen&&d.chosen.length){
  d.goals=d.probs.map(p=>{const x=probById(p);return x?{id:"g_"+p,text:GOALS[p]||x.t,src:"evidence",pid:p,macro:x.macro}:null}).filter(Boolean);
  d.legacy=true;
  if(d.goals.length===1&&!d.goal)d.goal=d.goals[0].id;
 }
 if(!d.reflectNote)d.reflectNote=d.notes||"";
 return d;
}

/* 3. Canvassing possible goals */
function goalSuggestions(){
 const have=new Set(D.goals.map(g=>g.pid?("p:"+g.pid):("t:"+g.text.trim().toLowerCase())));
 const out=[];
 const add=(o)=>{const k=o.pid?"p:"+o.pid:"t:"+o.text.trim().toLowerCase();if(have.has(k))return;if(o.src!=="teacher"&&out.some(x=>x.pid&&x.pid===o.pid))return;out.push(o)};
 const noteText=(D.obs?D.obs.notes:[]).map(n=>n.text).join(" ");
 (D.obsFocus||[]).forEach(f=>{
  if(f.type==="goal"){const x=probById(f.id);add({text:GOALS[f.id],src:"focus",pid:f.id,macro:x.macro})}
  else{const m=matchGoals(noteText,2,f.id);const ids=m.length?m.map(x=>x.pid):macroById(f.id).probs.slice(0,2).map(p=>p.id);ids.forEach(p=>add({text:GOALS[p],src:"focus",pid:p,macro:f.id}))}
 });
 const w=(D.reflect.work||"").trim();
 if(w){const b=matchGoals(w,1)[0];add(b?{text:w,src:"teacher",pid:b.pid,macro:b.macro,auto:true}:{text:w,src:"teacher"})}
 (D.suggested||[]).forEach(p=>{const x=probById(p);if(x)add({text:GOALS[p],src:"evidence",pid:p,macro:x.macro,why:(D.suggestWhy||{})[p]})});
 const tagged={};(D.obs?D.obs.notes:[]).filter(n=>n.macro&&!n.lf).forEach(n=>{(tagged[n.macro]=tagged[n.macro]||[]).push(n.text)});
 Object.entries(tagged).forEach(([m,txt])=>{const b=matchGoals(txt.join(" "),1,m)[0];const p=b?b.pid:macroById(m).probs[0].id;add({text:GOALS[p],src:"notes",pid:p,macro:m,why:"“"+txt[0].slice(0,60)+(txt[0].length>60?"…":"")+"”"})});
 (settings.playbook||[]).slice(0,4).forEach(id=>{const p=probsOfTech(id)[0];if(p){const x=probById(p);add({text:GOALS[p],src:"playbook",pid:p,macro:x.macro,tech:id})}});
 return out;
}

let goalQ="",goalArea="",editGoal=null;

 ${D.goals.length?`<h3 style="margin-top:16px">Possible goals</h3>${D.goals.map(g=>`<div class="goal ${D.goal===g.id?"on":""}">
  <label class="gpick"><input type="radio" name="agreed" data-agree="${g.id}" ${D.goal===g.id?"checked":""}> Agree</label>
  <div class="gbody">${editGoal===g.id?`<div class="gedit"><textarea class="t" rows="2" data-gtext="${g.id}">${esc(g.text)}</textarea><button class="btn sm hi" data-gdone="${g.id}">Done</button></div>`:`<div class="gtxt"><span>${esc(g.text)}</span><button class="btn ghost pen" data-gedit="${g.id}" aria-label="Edit goal" title="Edit wording">✎</button></div>${studentLed(g.text)?"":`<div class="nudge">Tip: try writing it as what students will do, e.g. “Students …” <button class="btn ghost" data-gedit="${g.id}">Reword ✎</button></div>`}`}<div class="row small" style="margin-top:4px;gap:6px"><span class="pill">${SRC[g.src]||"Added"}</span>${g.pid||g.macro?(D.goal===g.id?"":`<span class="muted">${esc(macroById(g.macro).n)}</span>`):`<span style="color:#b00020">Link it to a focus area so Blueprint can suggest techniques:</span>`}</div>
  ${!g.pid&&!g.macro?`${(()=>{const mm=matchGoals(g.text,3);return mm.length?`<div class="dym"><span class="small">Did you mean:</span>${mm.map(x=>`<button class="btn sm alt" data-linkgoal="${g.id}|${x.pid}">${esc(GOALS[x.pid])}</button>`).join("")}</div>`:""})()}<div style="margin-top:6px">${goalMapSel(g)}</div>`:`${D.goal===g.id?`<div class="small" style="margin-top:6px">${vtlmLine(g.macro)}</div>`:""}<details class="small" style="margin-top:4px"><summary>Change link</summary>${goalMapSel(g)}</details>`}</div>
  <button class="btn ghost" data-delgoal="${g.id}" title="Remove">✕</button></div>`).join("")}`:""}
 <h3 style="margin-top:16px">Find or write a goal</h3>
 <div class="row"><input class="t" id="goalQ" style="flex:1;min-width:220px" placeholder="Search goals or a technique, e.g. answer, transitions, no opt out" value="${esc(goalQ)}">
 <select class="t" id="goalArea" style="width:auto;max-width:100%"><option value="">All focus areas</option>${ELEMENTS.map(e=>`<optgroup label="${e.n}">${MACROS.filter(m=>m.el===e.id).map(m=>`<option value="${m.id}" ${goalArea===m.id?"selected":""}>${esc(m.n)}</option>`).join("")}</optgroup>`).join("")}</select></div>
 ${hits.length?`<div class="hits">${hits.slice(0,12).map(({p,m,tech})=>`<div class="bprob"><div><div>${esc(GOALS[p.id])}</div><div class="small muted">${esc(m.n)} · Seen: ${esc(p.t)}${tech?` · <b>${esc(T[tech].n)}</b> is a best bet`:""}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm hi" data-agreeprob="${p.id}">Agree</button><button class="btn sm alt" data-addprob="${p.id}" ${D.goals.some(g=>g.pid===p.id)?"disabled":""}>+ Option</button></div></div>`).join("")}${hits.length>12?`<p class="small muted">${hits.length-12} more – narrow your search.</p>`:""}</div>`:(q||goalArea)?`<p class="small muted">No matching goals. Write your own below.</p>`:""}
 <div class="row" style="margin-top:10px"><input class="t" id="newGoal" style="flex:1;min-width:240px" placeholder="Or write a goal in your own words"><button class="btn alt sm" data-act="addgoal">+ Add goal</button></div>

function applyGoal(){

function cycleBefore(d){if(!d||!d.prev)return null;return saved.find(s=>s.id===d.prev)||null}

const GROWTH_MEASURES=[
 {k:"otrPerMin",label:"Opportunities to respond per minute",dir:1,val:s=>s.otrPerMin,fmt:v=>v.toFixed(1)},
 {k:"whole",label:"Whole-class responses per 10 minutes",dir:1,val:s=>s.mins?s.whole/s.mins*10:null,fmt:v=>v.toFixed(1)},
 {k:"checks",label:"Checks for understanding per 10 minutes",dir:1,val:s=>s.mins?s.checks/s.mins*10:null,fmt:v=>v.toFixed(1)},
 {k:"vol",label:"Answers from volunteers",dir:-1,val:s=>s.volPct,fmt:v=>Math.round(v*100)+"%"},
 {k:"gap",label:"Longest stretch with no student response",dir:-1,val:s=>s.gapMins,fmt:v=>Math.round(v)+" min"},
 {k:"pos",label:"Positive to corrective comments",dir:1,val:s=>(s.pos+s.cor)?s.pos/Math.max(s.cor,1):null,fmt:(v,s)=>`${s.pos} : ${s.cor}`},
 {k:"cov",label:"Students who responded at least once",dir:1,val:s=>s.coverage,fmt:(v,s)=>`${s.responded}/${s.rosterSize}`}
];
function growthData(d){
 const pc=cycleBefore(d);if(!pc)return null;
 const a=pc.obs&&obsElapsed(pc.obs)>=60?obsStats(pc.obs):null, b=d.obs&&obsElapsed(d.obs)>=60?obsStats(d.obs):null;
 const rows=[];
 if(a&&b)GROWTH_MEASURES.forEach(m=>{const va=m.val(a),vb=m.val(b);if(va==null||vb==null||isNaN(va)||isNaN(vb))return;if(m.k==="cov"&&!(a.rosterSize&&b.rosterSize))return;
  const diff=vb-va,base=Math.max(Math.abs(va),m.k==="gap"?1:m.k==="vol"||m.k==="cov"?0.1:0.5);
  const trend=Math.abs(diff)/base<0.1?"same":(diff*m.dir>0?"up":"down");
  rows.push({label:m.label,prev:m.fmt(va,a),now:m.fmt(vb,b),trend})});
 const steps=(pc.chosen||[]).filter(id=>T[id]).map(id=>{const p=(pc.plans||{})[id]||{},look=p.look||(T[id].look||[])[0]||"";
  return {id,name:T[id].n,action:p.action||"",look,prevSeen:seenCount(pc.obs,look),nowSeen:seenCount(d.obs,look),level:latestLevel(pc,id)}});
 const g=(pc.goals||[]).find(x=>x.id===pc.goal);
 const up=rows.filter(r=>r.trend==="up").length;
 return {pc,goal:g?g.text:"",rows,steps,up,total:rows.length,hasObs:!!(a&&b)};
}

  const st=s.obs&&obsElapsed(s.obs)>=60?obsStats(s.obs):null;const g=(s.goals||[]).find(x=>x.id===s.goal);
  const lv=(s.chosen||[]).map(id=>latestLevel(s,id)).filter(Boolean);
  return {id:s.id,date:s.date,goal:g?g.text:"",techs:(s.chosen||[]).filter(id=>T[id]).map(id=>T[id].n),otr:st?st.otrPerMin:null,level:lv.length?lv[lv.length-1]:""}});
}

function cleanVideo(u){u=(u||"").trim();const m=u.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);if(m)u=m[1];return u.replace(/&amp;/g,"&")}
function ytId(u){const m=u.match(/(?:youtube(?:-nocookie)?\.com\/(?:embed\/|shorts\/|live\/|v\/|watch\?(?:[^#]*&)?v=)|youtu\.be\/)([A-Za-z0-9_-]{11})/i);return m?m[1]:null}
function ytStart(u){const m=u.match(/[?&#](?:t|start)=(\d+h)?(\d+m)?(\d+)s?/i);if(!m)return 0;return (parseInt(m[1])||0)*3600+(parseInt(m[2])||0)*60+(parseInt(m[3])||0)}
function vidKind(u){return ytId(u)?"yt":/drive\.google\.com|docs\.google\.com/i.test(u)?"drive":/sharepoint\.com|onedrive\.live\.com|1drv\.ms/i.test(u)?"ms":"other"}
function embedUrl(u){u=cleanVideo(u);
 let m=u.match(/(?:drive|docs)\.google\.com\/file\/d\/([^/?#]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([^&#]+)/);
 if(m)return "https://drive.google.com/file/d/"+m[1]+"/preview";
 const y=ytId(u);if(y){const st=ytStart(u);return "https://www.youtube-nocookie.com/embed/"+y+"?rel=0"+(st?"&start="+st:"")}
 if(/sharepoint\.com/i.test(u)){
  if(/\/_layouts\/15\/embed\.aspx/i.test(u))return u;
  if(/\/_layouts\/15\/stream\.aspx/i.test(u))return u.replace(/stream\.aspx/i,"embed.aspx");
  return null}
 if(/onedrive\.live\.com\/embed/i.test(u))return u;
 return null;
}
let vidEdit=false,nuEdit=false;
function watchUrl(v){const u=cleanVideo(v),y=ytId(u);if(y){const st=ytStart(u);return "https://www.youtube.com/watch?v="+y+(st?"&t="+st+"s":"")}const m=u.match(/(?:drive|docs)\.google\.com\/file\/d\/([^/?#]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([^&#]+)/);if(m)return "https://drive.google.com/file/d/"+m[1]+"/view";return u}
function videoBlock(v,compact){const u=cleanVideo(v),e=embedUrl(u),k=vidKind(u),fr=typeof framed==="function"&&framed();

  :k==="ms"?"To play this SharePoint video inside Blueprint, open it in Stream, choose <b>Share › Embed code</b>, and paste that code into the video box on the technique page.":"This link can’t play inside Blueprint – use Open in new tab.";
 return `${e&&!fr?`<div class="vidframe"><iframe src="${esc(e)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Practice video"></iframe></div>`:""}

let curTeacher="";
const tKey=s=>s.teacher||"(No teacher name)";
function cyclesOf(name){return saved.filter(s=>tKey(s)===name).map(norm).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||((a.prev===b.id)?1:(b.prev===a.id)?-1:0))}
const PROG_MEASURES=[
 {k:"otr",label:"Opportunities to respond",unit:"per minute",dir:1,val:s=>s.otrPerMin,fmt:v=>v.toFixed(1)},
 {k:"whole",label:"Whole-class responses",unit:"per 10 minutes",dir:1,val:s=>s.mins?s.whole/s.mins*10:null,fmt:v=>v.toFixed(1)},
 {k:"checks",label:"Checks for understanding",unit:"per 10 minutes",dir:1,val:s=>s.mins?s.checks/s.mins*10:null,fmt:v=>v.toFixed(1)},
 {k:"vol",label:"Answers from volunteers",unit:"% of answers – lower is better",dir:-1,val:s=>s.volPct==null?null:s.volPct*100,fmt:v=>Math.round(v)+"%"},
 {k:"pos",label:"Positive to corrective",unit:"positive comments per corrective",dir:1,val:s=>(s.pos+s.cor)?s.pos/Math.max(s.cor,1):null,fmt:v=>v.toFixed(1)},
 {k:"gap",label:"Longest gap with no response",unit:"minutes – lower is better",dir:-1,val:s=>s.gapMins,fmt:v=>Math.round(v)+" min"}
];
function progressData(name){
 const list=cyclesOf(name);
 const cyc=list.map((s,i)=>{const st=s.obs&&obsElapsed(s.obs)>=60?obsStats(s.obs):null;const g=(s.goals||[]).find(x=>x.id===s.goal);
  const nxt=list.find(x=>x.prev===s.id)||list[i+1];
  const look=(s.chosen||[]).filter(id=>T[id]).map(id=>{const p=(s.plans||{})[id]||{};const l=p.look||(T[id].look||[])[0]||"";return {id,name:T[id].n,look:l,level:latestLevel(s,id),seenNext:nxt?seenCount(nxt.obs,l):null}});
  return {s,i,label:"Cycle "+(i+1),date:s.date,st,goal:g?g.text:"",steps:look}});
 const series=PROG_MEASURES.map(m=>({m,pts:cyc.map(c=>({label:c.label,date:c.date,v:c.st?m.val(c.st):null}))})).filter(x=>x.pts.filter(p=>p.v!=null&&!isNaN(p.v)).length>=1);
 const levels=cyc.flatMap(c=>c.steps.filter(x=>x.level).map(x=>x.level));
 return {name,list,cyc,series,levels};
}
function changeOf(pts,m){const ok=pts.filter(p=>p.v!=null&&!isNaN(p.v));if(ok.length<2)return null;const a=ok[0].v,b=ok[ok.length-1].v,base=Math.max(Math.abs(a),m.k==="gap"?1:m.k==="vol"?10:0.5);
 const trend=Math.abs(b-a)/base<0.1?"same":((b-a)*m.dir>0?"up":"down");return {a,b,trend}}
/* charts – colours given explicitly so they also render into Word files */
function lineChartSVG(pts,m,opt={}){
 const W=opt.w||340,H=opt.h||170,L=48,R=20,Tp=22,B=34,col=opt.col||(settings.theme||THEME_DEFAULT).accent,navy=opt.navy||(settings.theme||THEME_DEFAULT).dark;
 const vals=pts.map(p=>p.v==null||isNaN(p.v)?null:p.v),ok=vals.filter(v=>v!=null);if(!ok.length)return "";
 let mx=Math.max(...ok),mn=0;mx=m.k==="vol"?100:(mx<=0?1:mx*1.15);
 const n=pts.length,X=i=>L+(n>1?i*(W-L-R)/(n-1):(W-L-R)/2),Y=v=>Tp+(1-(v-mn)/(mx-mn))*(H-Tp-B);
 const grid=[0,0.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#DCE6F2" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3.5}" font-size="10" text-anchor="end" fill="#5A6878" font-family="Arial">${m.k==="vol"?Math.round(v)+"%":v>=10?Math.round(v):v.toFixed(1)}</text>`}).join("");
 const line=vals.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean);
 const last=vals.length-1-[...vals].reverse().findIndex(v=>v!=null);
 const dots=vals.map((v,i)=>v==null?"":`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===last?5:3.5}" fill="${i===last?navy:col}" stroke="#fff" stroke-width="1.5"/><text x="${X(i)}" y="${Y(v)-9}" font-size="11" font-weight="${i===last?700:400}" text-anchor="middle" fill="${navy}" font-family="Arial">${m.fmt(v)}</text>`).join("");
 const xl=pts.map((p,i)=>`<text x="${X(i)}" y="${H-B+16}" font-size="10" text-anchor="middle" fill="#5A6878" font-family="Arial">${esc(p.label.replace("Cycle ","C"))}</text><text x="${X(i)}" y="${H-B+28}" font-size="9" text-anchor="middle" fill="#8A97A8" font-family="Arial">${esc((p.date||"").slice(5))}</text>`).join("");
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${opt.px?W:"100%"}" ${opt.px?`height="${H}"`:""} role="img" aria-label="${esc(m.label)}: ${ok.map(m.fmt).join(", ")}"><rect width="${W}" height="${H}" fill="#fff"/>${grid}${line.length>1?`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${line.join(" ")}"/>`:""}${dots}${xl}</svg>`}
function sparkSVG(vals){const ok=vals.filter(v=>v!=null);if(ok.length<2)return "";const W=120,H=34,mx=Math.max(...ok)*1.1||1,n=vals.length,X=i=>4+i*(W-8)/(n-1),Y=v=>H-4-(v/mx)*(H-8);
 const pts=vals.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean);return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${pts.join(" ")}"/>${vals.map((v,i)=>v==null?"":`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===n-1?3.5:2.5}" fill="${i===n-1?"var(--navy)":"var(--blue)"}"/>`).join("")}</svg>`}
const LV_COL={secure:"#1e6b34",partly:"#b45309",notyet:"#9b1c1c"};
function dueInfo(list){const last=list[list.length-1];const dates=(last.chosen||[]).map(c=>(last.plans[c]||{}).follow).filter(Boolean).sort();
 const done=(last.followups||[]).some(f=>f.date>=last.date);if(done)return {cls:"ok",txt:"Follow-up recorded"};if(!dates.length)return {cls:"none",txt:"No follow-up date"};
 const td=today(),d=dates[0];if(d<td)return {cls:"late",txt:"Follow-up overdue · "+d};const soon=ymdL(new Date(Date.now()+7*864e5));return d<=soon?{cls:"soon",txt:"Follow-up due "+d}:{cls:"ok",txt:"Follow-up "+d}}

function svgToPng(svg,w,h){return new Promise(res=>{try{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=w*2;c.height=h*2;const x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0,w,h);res(c.toDataURL("image/png"))};img.onerror=()=>res("");img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}catch(e){res("")}})}
async function progressSheet(name){

 for(const x of pd.series){const svg=lineChartSVG(x.pts,x.m,{w:330,h:170,px:1});charts.push({x,png:await svgToPng(svg,330,170)})}

function icsFor(d){
 const fd=followupDate(d);if(!fd)return null;
 const ymd=fd.replace(/-/g,""),next=new Date(fd+"T00:00:00Z");next.setUTCDate(next.getUTCDate()+1);const ymd2=next.toISOString().slice(0,10).replace(/-/g,"");

 const fold=s=>s.match(/.{1,70}/g).join("\r\n ");
 const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
 return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Blueprint//Coaching//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
  `UID:${d.id}-followup@blueprint`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${ymd}`,`DTEND;VALUE=DATE:${ymd2}`,
  fold(`SUMMARY:${esc2("Coaching follow-up – "+(d.teacher||"teacher")+(d.cls?" ("+d.cls+")":""))}`),fold(`DESCRIPTION:${esc2(desc)}`),"TRANSP:TRANSPARENT",
  "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Coaching follow-up","TRIGGER:-PT15H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n")}

const TFIELDS=["n","m","also","src","p","w","steps","look","pit","say"];
const FIELD_LABEL={n:"name",m:"focus area",also:"also supports",src:"source",p:"purpose",w:"why it works",steps:"steps",look:"look-fors",pit:"pitfalls",say:"rehearsal",probs:"best bet for"};
const pickT=t=>{const o={};TFIELDS.forEach(k=>{o[k]=t[k]==null?(["also","steps","look","pit"].includes(k)?[]:""):t[k]});return o};
function parseTechRows(rows){
 const H=(rows[0]||[]).map(h=>String(h||"").toLowerCase().replace(/[–—]/g,"-").replace(/\s+/g," ").trim());
 const ix=re=>H.findIndex(h=>re.test(h));
 const C={id:ix(/^id\b/),n:ix(/^technique name/),m:ix(/^focus area/),also:ix(/^also/),p:ix(/^purpose/),w:ix(/^why/),look:ix(/^look.?for/),pit:ix(/pitfall/),say:ix(/^rehearse/),src:ix(/^related|^source/),bb:ix(/^best bet/),chg:ix(/^changes/)};
 const S=[1,2,3,4,5].map(i=>[ix(new RegExp(`^step ${i} - title`)),ix(new RegExp(`^step ${i} - what`))]);
 const macroByName=s=>{const q=String(s||"").trim().toLowerCase();const m=MACROS.find(x=>x.n.toLowerCase()===q);return m?m.id:""};
 const parseAlso=v=>{const q=v.toLowerCase(),hits=[];MACROS.forEach(m=>{const i=q.indexOf(m.n.toLowerCase());if(i>=0)hits.push([i,i+m.n.length,m.id])});hits.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);let end=-1;return hits.filter(h=>{if(h[0]<end)return false;end=h[1];return true}).map(h=>h[2])};
 const g=(r,i)=>i<0?"":String(r[i]==null?"":r[i]).replace(/\r\n/g,"\n").trim();
 const lines=v=>v.split("\n").map(s=>s.replace(/^[•\-–*]\s*/,"").trim()).filter(Boolean);
 const probByTitle={};MACROS.forEach(m=>m.probs.forEach(p=>probByTitle[p.t.trim().toLowerCase()]=p.id));
 const res={upd:[],add:[],rm:[],notes:[],skip:[]};
 rows.slice(1).forEach((r,ri)=>{
  const id=g(r,C.id),name=g(r,C.n),chg=g(r,C.chg);if(!id&&!name)return;
  const cur=id&&T[id]?pickT(T[id]):null;
  if(id&&!cur){res.skip.push(`Row ${ri+2}: ID “${id}” isn’t in this copy of Blueprint`);return}
  if(/^remove\b/i.test(chg)){if(cur&&T[id].own)res.rm.push(id);else res.skip.push(`${name||id}: built-in techniques can’t be removed`);return}
  if(chg)res.notes.push([name||id,chg]);
  const mName=g(r,C.m),m=macroByName(mName);
  const d={n:name||(cur?cur.n:""),m:m||(cur?cur.m:""),also:C.also<0?(cur?cur.also:[]):parseAlso(g(r,C.also)),
   p:g(r,C.p)||(cur?cur.p:""),w:C.w<0?(cur?cur.w:""):g(r,C.w),steps:S.map(([a,b])=>[g(r,a),g(r,b)]).filter(s=>s[0]||s[1]),
   look:C.look<0?(cur?cur.look:[]):lines(g(r,C.look)),pit:C.pit<0?(cur?cur.pit:[]):lines(g(r,C.pit)),say:C.say<0?(cur?cur.say:""):g(r,C.say),src:C.src<0?(cur?cur.src:""):g(r,C.src)};
  if(C.bb>=0){const want=lines(g(r,C.bb)),ids=[];want.forEach(t=>{const pid=probByTitle[t.toLowerCase()];if(pid)ids.push(pid);else res.skip.push(`${d.n}: best-bet problem “${t}” not recognised`)});d.probs=ids}
  if(mName&&!m)res.skip.push(`${d.n}: focus area “${mName}” not recognised – kept the current one`);
  d.also=d.also.filter(a=>a!==d.m);
  if(cur){if(!d.steps.length)d.steps=cur.steps;
   const same=(k,a,b)=>k==="also"?JSON.stringify([...a].sort())===JSON.stringify([...b].sort()):JSON.stringify(a)===JSON.stringify(b);const diff=TFIELDS.filter(k=>!same(k,d[k],cur[k]));if(d.probs){const now=probsOfTech(id);if(JSON.stringify([...d.probs].sort())!==JSON.stringify([...now].sort()))diff.push("probs");else delete d.probs}if(diff.length)res.upd.push({id,d,diff});}
  else{if(!d.m||!d.p||!d.steps.length){res.skip.push(`${d.n}: a new technique needs a focus area, purpose and at least one step`);return}res.add.push({d})}
 });
 return res;
}

function rehFeedback(id,p){

/* ---------- staff feedback page (term report) ---------- */
function staffFeedbackHTML(L,WL){
 const S=walkSummary(WL),work=[],next=[];if(WL.length<3)S.seenPct=[];
 S.seenPct.filter(r=>r[1]>=50).slice(0,3).forEach(([k,v])=>work.push(`${k} was seen in ${v}% of learning walk visits.`));
 const sec={};L.forEach(s=>(s.followups||[]).forEach(f=>Object.entries(f.ratings||{}).forEach(([id,r])=>{if(r.level==="secure"&&T[id])sec[id]=(sec[id]||0)+1})));
 Object.entries(sec).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([id,n])=>work.push(`${T[id].n} is becoming secure in classrooms (${n} follow-up${n>1?"s":""}).`));
 S.seenPct.filter(r=>r[1]<30&&/whiteboard|everybody|turn and talk|check|signal|choral/i.test(r[0])).slice(0,3).forEach(([k,v])=>next.push(v?`${k} was seen in ${v}% of visits – a chance to build it in.`:`${k} wasn’t seen on learning walks – a chance to build it in.`));
 const f=focusTech();if(f){const fv=WL.filter(v=>v.focus===f);(T[f].look||[]).map(l=>[l,fv.filter(v=>(v.lf||{})[l]).length]).filter(x=>fv.length&&x[1]/fv.length<0.4).slice(0,2).forEach(([l])=>next.push(`School focus (${T[f].n}): “${l}” was seen less often.`))}
 if(!work.length&&!next.length)return "";
 return `<div class="page">${head("Feedback for all staff",focusTerm()||rangeLabel())}
 <p>A whole-school summary from coaching and learning walks. It describes patterns across classrooms – it isn’t about any one teacher.</p>
 <h2>What’s working</h2>${work.length?`<ul>${work.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="lines"><div class='l'></div><div class='l'></div></div>`}
 <h2>Next steps</h2>${next.length?`<ul>${next.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="lines"><div class='l'></div><div class='l'></div></div>`}
 <h2>Our focus for the coming weeks</h2><div class="lines">${"<div class='l'></div>".repeat(3)}</div></div>`;
}
